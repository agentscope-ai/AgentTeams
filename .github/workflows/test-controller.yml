  runtime-bundle-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install runtime bundle test dependencies
        run: |
          python -m pip install \
            'PyYAML>=6.0,<7' \
            'qwenpaw>=2.2.1,<2.3' \
            'pytest>=8.3,<10'

      - name: Check bundle script syntax
        run: |
          bash -n plugins/agentteams-matrix/scripts/install.sh \
            plugins/agentteams-matrix/scripts/uninstall.sh \
            plugins/agentteams-matrix/adapters/qwenpaw/install.sh \
            plugins/agentteams-matrix/adapters/qwenpaw/uninstall.sh \
            plugins/agentteams-teamharness/scripts/install.sh \
            plugins/agentteams-teamharness/scripts/uninstall.sh \
            plugins/agentteams-teamharness/adapters/qwenpaw/install.sh \
            plugins/agentteams-teamharness/adapters/qwenpaw/uninstall.sh

      - name: Validate TeamHarness bundle manifest and package
        run: |
          ruby plugins/scripts/validate-plugin.rb plugins/teamharness/plugin.yaml
          ruby plugins/scripts/validate-plugin.rb plugins/agentteams-teamharness/plugin.yaml
          OUT_DIR="$(mktemp -d)" ruby plugins/scripts/package-plugin.rb plugins/agentteams-teamharness/plugin.yaml

      - name: Run contract golden and install idempotence tests
        run: |
          python -m pytest plugins/tests/agentteams-matrix/golden -q
          python -m pytest plugins/tests/agentteams-teamharness/golden -q

  openclaw-native-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned OpenClaw CLI
        run: npm install -g openclaw@2026.4.14

      - name: Install test dependencies
        run: |
          python -m pip install \
            'pytest>=8.3,<10'

      - name: Run OpenClaw native discovery regression
        env:
          OPENCLAW_BIN: openclaw
          OPENCLAW_EXPECTED_VERSION: '2026.4.14'
        run: |
          python -m pytest plugins/tests/agentteams-teamharness/test_openclaw_native_discovery.py -q -rs

  openclaw-child-env:
    # #1459 P2: the native child-env regression must actually RUN in CI — the
    # discovery suite alone does not select it. A configured SDK that cannot
    # run fails this required job (AGENTTEAMS_TEST_REQUIRE_NATIVE_SDK turns
    # the skips into failures) instead of a silent green.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned OpenClaw CLI
        run: npm install -g openclaw@2026.4.14

      - name: Install test dependencies
        run: |
          python -m pip install \
            'pytest>=8.3,<10'

      - name: Run the OpenClaw child-env regressions
        env:
          OPENCLAW_BIN: openclaw
          OPENCLAW_EXPECTED_VERSION: '2026.4.14'
          AGENTTEAMS_TEST_REQUIRE_NATIVE_SDK: '1'
        run: |
          python -m pytest plugins/tests/agentteams-teamharness/test_openclaw_child_env.py -q -rs

  hermes-native-child-env:
    # #1459 P2: the Hermes mirror of the OpenClaw child-env job. hermes-agent
    # is cloned at the adapter's declared minimum (v2026.4.16); its import
    # closure is installed explicitly because the SDK pins its own
    # dependencies to python >= 3.14 (a tree install provides no closure on
    # 3.11). A configured SDK that cannot run fails the job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Shallow-clone hermes-agent at the declared minimum
        id: sdk
        env:
          HERMES_SDK_REF: v2026.4.16
        run: |
          SDK_ROOT="$(mktemp -d)"
          git clone --depth 1 --branch "$HERMES_SDK_REF" \
            https://github.com/NousResearch/hermes-agent.git "$SDK_ROOT"
          echo "root=$SDK_ROOT" >> "$GITHUB_OUTPUT"

      - name: Install the real-SDK import closure and test dependencies
        run: |
          python -m pip install \
            'ruamel.yaml>=0.18,<0.19' \
            'matrix-nio>=0.25,<0.27' \
            'PyYAML>=6.0,<7' \
            'qwenpaw>=2.2.1,<2.3' \
            'python-dotenv>=1.0,<2' \
            'httpx>=0.27,<1' \
            'openai>=1.0' \
            'pydantic>=2.0,<3' \
            'requests>=2.31' \
            'rich>=13.0' \
            'tenacity>=8.0' \
            'Markdown>=3.5' \
            'jinja2>=3.1' \
            'packaging>=24.0' \
            'pytest>=8.3,<10'

      - name: Run the Hermes child-env regressions
        env:
          HERMES_SDK_ROOT: ${{ steps.sdk.outputs.root }}
          AGENTTEAMS_TEST_REQUIRE_NATIVE_SDK: '1'
        run: |
          python -m pytest plugins/tests/agentteams-teamharness/test_hermes_child_env.py -q -rs

