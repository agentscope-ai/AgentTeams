name: Helm Lint

on:
  pull_request:
    paths:
      - 'helm/**'
      - 'install/agentteams-install.sh'
      - 'install/agentteams-install.ps1'
      - 'install/agentteams-apply.sh'
      - 'Makefile'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-rc.yml'
      - '.github/workflows/build-deepseek-harness.yml'
      - '.github/workflows/release.yml'
      - 'openhuman/scripts/openhuman-worker-entrypoint.sh'
      - 'tests/check-agentteams-rename-defaults.sh'
      - 'tests/check-installer-pre-1.2-env-compat.sh'
      - 'tests/check-installer-embedded-latest-pull.sh'
      - 'tests/check-installer-qwenpaw-runtime-options.sh'
      - 'tests/check-installer-deepseek-harness-runtime-options.sh'
      - 'tests/check-powershell-deepseek-harness-latest.ps1'
      - 'tests/check-windows-appservice-normalization.ps1'
      - 'tests/check-apply-wrapper-flags.sh'
      - 'tests/check-helm-agentteams.sh'
  workflow_dispatch: ~

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AgentTeams rename contracts
        run: bash tests/check-agentteams-rename-defaults.sh

      - name: Check pre-v1.2 installer compatibility
        run: bash tests/check-installer-pre-1.2-env-compat.sh

      - name: Check embedded latest image pulling
        run: bash tests/check-installer-embedded-latest-pull.sh

      - name: Check QwenPaw installer runtime options
        run: bash tests/check-installer-qwenpaw-runtime-options.sh

      - name: Check DeepSeek Harness installer runtime options
        run: bash tests/check-installer-deepseek-harness-runtime-options.sh

      - name: Check Windows AppService normalization
        shell: pwsh
        run: ./tests/check-windows-appservice-normalization.ps1

      - name: Check declarative apply wrapper flags
        run: bash tests/check-apply-wrapper-flags.sh

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Add dependency repos
        run: helm repo add higress.io https://higress.io/helm-charts

      - name: Build dependencies
        run: helm dependency build helm/agentteams/

      - name: Lint
        run: helm lint helm/agentteams/

      - name: Template dry-run
        run: |
          bash tests/check-helm-agentteams.sh
