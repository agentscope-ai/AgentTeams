name: Check Harness publication
on:
  pull_request:
    paths:
      - '.github/workflows/publish-harnesses.yml'
      - '.github/workflows/check-harness-publication.yml'
      - 'scripts/release/**'
      - 'tests/test-harness-publication.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: bash -n scripts/release/build-harness-platform.sh
      - run: python3 tests/test-harness-publication.py
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/publish-harnesses.yml .github/workflows/check-harness-publication.yml
