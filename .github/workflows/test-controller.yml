          import nio  # noqa: F401  the suite skips without matrix-nio
          print("matrix-nio", md.version("matrix-nio"))
          print("qwenpaw", md.version("qwenpaw"))
          PY

      - name: Run matrix-channel retry-classifier regression tests
        run: |
          python -m pytest plugins/tests/agentteams-matrix-channel/test_retry_classifier.py -q -rs

