name: Verify canonical release artifacts on native runners
on:
  workflow_dispatch:
    inputs:
      source:
        description: Merged Core release source SHA
        required: true
        type: string
      core_version:
        description: Core and shared Harness tag to verify
        default: v1.2.8
        type: string
      images:
        description: JSON array of image names; empty verifies all eleven
        default: ''
        type: string
      arch:
        description: Native architectures
        type: choice
        options: [both, amd64, arm64]
        default: both
      dashboard_version:
        description: Dashboard image tag to verify
        default: v1.4.3
        type: string
      dashboard_tree:
        description: Expected Dashboard source tree
        default: 138e742d499078dc5b5f970339cfd226185eace0
        type: string
permissions:
  contents: read
env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          SOURCE: ${{ inputs.source }}
          CORE_VERSION: ${{ inputs.core_version }}
          IMAGES: ${{ inputs.images }}
          ARCH: ${{ inputs.arch }}
        run: |
          python3 - <<'PY'
          import json, os, re
          assert re.fullmatch('[a-f0-9]{40}', os.environ['SOURCE'])
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', os.environ['CORE_VERSION'])
          allowed = ['agentteams-controller','openclaw-base','agentteams-embedded'] + [
            'agentteams-harness-'+r for r in ['openclaw','qwenpaw','hermes','deepseek','openhuman','codex']
          ] + ['dashboard','dashboard-unified']
          images=json.loads(os.environ['IMAGES']) if os.environ['IMAGES'] else allowed
          assert images and set(images) <= set(allowed)
          arches=['amd64','arm64'] if os.environ['ARCH']=='both' else [os.environ['ARCH']]
          matrix=[{'image': image, 'arch': arch, 'runner': 'ubuntu-24.04-arm' if arch=='arm64' else 'ubuntu-24.04'} for image in images for arch in arches]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('matrix='+json.dumps(matrix)+'\n')
          PY
  verify:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Resolve canonical source and immutable native child
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          CORE_VERSION: ${{ inputs.core_version }}
          DASHBOARD_VERSION: ${{ inputs.dashboard_version }}
          DASHBOARD_TREE: ${{ inputs.dashboard_tree }}
        run: |
          if [[ "$IMAGE" == dashboard* ]]; then
            ref="$REGISTRY/agentteams/agentteams-dashboard:$DASHBOARD_VERSION"
            [[ "$IMAGE" != dashboard-unified ]] || ref="$ref-unified"
            expected="$DASHBOARD_TREE"
          else
            ref="$REGISTRY/agentteams/$IMAGE:$CORE_VERSION"
            expected="$(git rev-parse 'HEAD^{tree}')"
          fi
          docker buildx imagetools inspect "$ref" --raw > /tmp/index.json
          jq -e --arg tree "$expected" '.annotations["io.agentteams.source-tree"] == $tree' /tmp/index.json
          jq -e '[.manifests[]|select(.platform.os=="linux")|.platform.architecture]|sort==["amd64","arm64"]' /tmp/index.json
          digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
          ref="${ref%:*}@$digest"
          echo "IMAGE_REF=$ref" >> "$GITHUB_ENV"
          timeout 600 docker pull --platform "linux/$ARCH" "$ref"
          test "$(docker image inspect "$ref" --format '{{.Os}}/{{.Architecture}}')" = "linux/$ARCH"
      - name: Check exact packaged Manager prompt and MCP implementation
        if: matrix.image != 'openclaw-base' && !startsWith(matrix.image, 'dashboard')
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          export MESSAGE_SHA="$(sha256sum plugins/teamharness/mcp/message_tool.py | cut -d' ' -f1)"
          export SERVER_SHA="$(sha256sum plugins/teamharness/mcp/server.py | cut -d' ' -f1)"
          export PROMPT_SHA="$(sha256sum plugins/teamharness/prompts/manager/AGENTS.md | cut -d' ' -f1)"
          docker run --rm --entrypoint sh -e MESSAGE_SHA -e SERVER_SHA -e PROMPT_SHA "$IMAGE_REF" -ec '
            files=$(find /opt/agentteams -name message_tool.py -type f)
            test -n "$files"
            for file in $files; do
              echo "$MESSAGE_SHA  $file" | sha256sum -c -
              echo "$SERVER_SHA  ${file%/*}/server.py" | sha256sum -c -
              echo "$PROMPT_SHA  ${file%/mcp/message_tool.py}/prompts/manager/AGENTS.md" | sha256sum -c -
            done
          '
          if [[ "$IMAGE" == agentteams-controller || "$IMAGE" == agentteams-embedded ]]; then
            docker run --rm --entrypoint sh -e PROMPT_SHA "$IMAGE_REF" -ec '
              echo "$PROMPT_SHA  /opt/agentteams/agent/manager-agent/AGENTS.md" | sha256sum -c -
            '
          fi
          if [[ "$IMAGE" == agentteams-harness-qwenpaw ]]; then
            docker run --rm --entrypoint /opt/venv/qwenpaw/bin/python \
              -e MESSAGE_SHA -e SERVER_SHA -e PROMPT_SHA "$IMAGE_REF" -c '
          import hashlib, os, zipfile
          from pathlib import Path
          from qwenpaw_worker.worker import Worker
          plugin = Path("/opt/agentteams/qwenpaw-builtin/plugins/teamharness")
          assert (plugin/".agentteams-builtin-plugin.sha256").read_text().strip() == Worker._plugin_directory_digest(None,plugin), "builtin marker does not match packaged plugin"
          with zipfile.ZipFile("/opt/agentteams/plugins/teamharness-qwenpaw.zip") as archive:
              for suffix, key in [("mcp/message_tool.py", "MESSAGE_SHA"), ("mcp/server.py", "SERVER_SHA"), ("prompts/manager/AGENTS.md", "PROMPT_SHA")]:
                  entries = [name for name in archive.namelist() if name.endswith("/teamharness/" + suffix)]
                  assert len(entries) == 1, (suffix, entries)
                  assert hashlib.sha256(archive.read(entries[0])).hexdigest() == os.environ[key], suffix
          print("Packaged QwenPaw archive matches the repaired source")
          '
          fi
      - name: Smoke exact published native artifact
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          ref="$IMAGE_REF"
          if [[ "$IMAGE" == dashboard* ]]; then
            base=''
            [[ "$IMAGE" != dashboard-unified ]] || base=/dashboard
            docker run -d --name dashboard-verify -p 127.0.0.1:3000:3000 "$ref"
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:3000$base/" >/tmp/home; then break; fi
              sleep 2
            done
            grep -q AgentTeams /tmp/home
            curl -fsS "http://127.0.0.1:3000$base/api/auth/session/" >/tmp/session.json
            jq -e 'type=="object"' /tmp/session.json
            docker exec dashboard-verify sh -ec 'test -w /data/agentteams-dashboard'
          else
            if [[ "$IMAGE" != openclaw-base ]]; then docker run --rm --entrypoint agt "$ref" tracing --help; fi
            case "$IMAGE" in
              openclaw-base)
                docker run --rm --entrypoint bash "$ref" -ec '
                  node -e "const v=process.versions.node.split(\".\").map(Number); if(v[0]!==24 || v[1]<22 || (v[1]===22 && v[2]<1)) process.exit(1)"
                  openclaw --version
                  grep -rFl "com.agentteams.read_audience" /opt/openclaw/dist/extensions/matrix >/dev/null
                  case "$(uname -m)" in
                    x86_64) binary_name=matrix-sdk-crypto.linux-x64-gnu.node ;;
                    aarch64) binary_name=matrix-sdk-crypto.linux-arm64-gnu.node ;;
                    *) exit 1 ;;
                  esac
                  binary=$(find /opt/openclaw/node_modules -name "$binary_name" -print -quit)
                  test -n "$binary"
                  node -e "require(process.argv[1])" "$binary"
                ' ;;
              agentteams-harness-openclaw)
                docker run --rm --entrypoint bash -v "$PWD/worker/tests/image-smoke.sh:/tmp/smoke.sh:ro" "$ref" /tmp/smoke.sh ;;
              agentteams-harness-qwenpaw)
                docker run --rm --entrypoint /opt/venv/qwenpaw/bin/python "$ref" -c 'import qwenpaw_worker' ;;
              agentteams-harness-hermes)
                docker run --rm --entrypoint /opt/venv/hermes/bin/python "$ref" -c 'import hermes_worker' ;;
              agentteams-harness-deepseek)
                docker run --rm --entrypoint python3 -v "$PWD/deepseek-harness/tests/headless_smoke.py:/tmp/smoke.py:ro" "$ref" /tmp/smoke.py ;;
              agentteams-harness-openhuman)
                docker run --rm --entrypoint openhuman-core "$ref" --help ;;
              agentteams-harness-codex)
                docker run --rm --entrypoint codex "$ref" --version
                docker run --rm --entrypoint /opt/venv/bin/python "$ref" -c 'import agentteams_codex.bridge' ;;
              agentteams-embedded)
                docker run --rm --entrypoint bash "$ref" -ec 'command -v agentteams-controller; command -v tuwunel; command -v minio; test -d /opt/agentteams/config/crd' ;;
            esac
          fi
          echo "$IMAGE linux/$ARCH $ref PASS" >> "$GITHUB_STEP_SUMMARY"
