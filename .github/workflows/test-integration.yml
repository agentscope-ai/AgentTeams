name: Integration Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'manager/**'
      - 'worker'
      - 'worker/**'
      - 'openclaw-base/**'
      - 'agentteams-controller/**'
      - 'tests/**'
      - 'install/**'
      - 'shared/**'
      - 'qwenpaw'
      - 'qwenpaw/**'
      - 'hermes'
      - 'hermes/**'
      - '.gitmodules'
      - 'deepseek-harness'
      - 'deepseek-harness/**'
      - 'plugins/teamharness/adapters/qwenpaw/**'
      - 'plugins/workerflow/adapters/qwenpaw/**'
      - 'Makefile'
      - 'hack/versions.env'
      - 'hack/ci-*.py'
      - 'hack/install-mc.py'
      - '.github/workflows/build-integration-images.yml'
      - '.github/workflows/test-integration.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'manager/**'
      - 'worker'
      - 'worker/**'
      - 'openclaw-base/**'
      - 'agentteams-controller/**'
      - 'tests/**'
      - 'install/**'
      - 'shared/**'
      - 'qwenpaw'
      - 'qwenpaw/**'
      - 'hermes'
      - 'hermes/**'
      - '.gitmodules'
      - 'deepseek-harness'
      - 'deepseek-harness/**'
      - 'plugins/teamharness/adapters/qwenpaw/**'
      - 'plugins/workerflow/adapters/qwenpaw/**'
      - 'Makefile'
      - 'hack/versions.env'
      - 'hack/ci-*.py'
      - 'hack/install-mc.py'
      - '.github/workflows/build-integration-images.yml'
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter pattern (e.g. "01 02 14"). Leave empty to run all non-GitHub tests.'
        required: false
        default: ''
      baseline_version:
        description: 'Re-generate baseline for a specific release version (e.g. v1.2.3). Pulls published image, runs tests, uploads baseline to that release. Leave empty to run normal integration tests.'
        required: false
        default: ''
      worker_runtime:
        description: 'Worker runtime label (informational only; the matrix always runs every entry).'
        required: false
        type: choice
        options:
          - both
          - openclaw
          - qwenpaw
          - hermes
        default: 'both'
      # Sibling input (declared after worker_runtime is complete). Lets a
      # maintainer exercise the published-base consumer path on a ref that
      # does not touch openclaw-base/**, without crafting a PR for it.
      openclaw_base_override:
        description: 'auto = use changed inputs/published prerequisite; force_unchanged probes the published base; force_rebuild compiles it once.'
        required: false
        type: choice
        options:
          - auto
          - force_unchanged
          - force_rebuild
        default: auto
      model:
        description: 'LLM model to use'
        required: false
        default: 'qwen3.6-plus'

permissions:
  # Fork PRs must remain read-only; secret-dependent shards are filtered below.
  contents: read
  pull-requests: read

env:
  # Tests that do not require a GitHub token, split into three shard types for parallel execution
  # Shard A: LLM interaction tests (sequential dependency: 02 creates alice → 03-06 use alice)
  # Shard C: Keep runtime-dependent coverage in each supported CI worker runtime.
  # Run fixed runtime-switch/name-validation scenarios once (QwenPaw), and
  # Manager-only startup/migration once on QwenPaw, not per worker.
  # CoPaw has no standalone shard; the legacy-upgrade coverage (test-29) runs on the pinned published image.
  SHARD_A_TESTS: "01 02 03 04 05 06"
  SHARD_C_TESTS: "15 17 18 19 20 22 24 100"
  SHARD_C_QWENPAW_TESTS: "15 17 18 19 20 22 23 24 25 27 28 29 100"
  SHARD_QWENPAW_TESTS: "26"
  NON_GITHUB_TESTS: "01 02 03 04 05 06 15 17 18 19 20 22 23 24 25 27 28 100"

jobs:
  # Release tags/manual runs keep full coverage. Pipeline-only diffs keep image
  # builds and Controller checks; docs/version pins avoid repeated model runs.
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_changed: ${{ steps.plan.outputs.base_changed }}
      test_matrix: ${{ steps.test-matrix.outputs.matrix }}
      run_builds: ${{ steps.plan.outputs.run_builds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Plan validation from the actual diff
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 hack/ci-integration-plan.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" | tee "$RUNNER_TEMP/integration-plan.json"
          echo "### Integration plan" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/integration-plan.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Select integration test matrix
        id: test-matrix
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
          RUN_MODELS: ${{ steps.plan.outputs.run_models }}
        run: |
          MATRIX='[
            {"shard":"llm-interaction","filter_env":"SHARD_A_TESTS","manager_runtime":"openclaw","worker_runtime":"openclaw","requires_secret":true},
            {"shard":"controller-cr","filter_env":"SHARD_C_TESTS","manager_runtime":"openclaw","worker_runtime":"openclaw","requires_secret":false},
            {"shard":"llm-interaction","filter_env":"SHARD_A_TESTS","manager_runtime":"qwenpaw","worker_runtime":"qwenpaw","requires_secret":true},
            {"shard":"controller-cr","filter_env":"SHARD_C_QWENPAW_TESTS","manager_runtime":"qwenpaw","worker_runtime":"qwenpaw","requires_secret":false},
            {"shard":"qwenpaw-teamharness","filter_env":"SHARD_QWENPAW_TESTS","manager_runtime":"qwenpaw","worker_runtime":"qwenpaw","requires_secret":true},
            {"shard":"llm-interaction","filter_env":"SHARD_A_TESTS","manager_runtime":"qwenpaw","worker_runtime":"hermes","requires_secret":true},
            {"shard":"controller-cr","filter_env":"SHARD_C_TESTS","manager_runtime":"qwenpaw","worker_runtime":"hermes","requires_secret":false}
          ]'
          if [ "$UNTRUSTED_PR" = "true" ] || [ "${RUN_MODELS:-true}" = false ]; then
            MATRIX=$(echo "$MATRIX" | jq -c '[.[] | select(.requires_secret == false)]')
          fi
          MATRIX=$(echo "$MATRIX" | jq -c '.')
          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"

  # Registry/source-base failures affect only OpenClaw consumers.
  resolve-openclaw-base:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
    outputs:
      openclaw_base: ${{ steps.decide.outputs.openclaw_base }}
      openclaw_base_ref: ${{ steps.decide.outputs.openclaw_base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.REGISTRY_USERNAME != ''
        with:
          registry: higress-registry.cn-hangzhou.cr.aliyuncs.com
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Decide whether to rebuild openclaw-base
        id: decide
        env:
          OVERRIDE: ${{ inputs.openclaw_base_override }}
          BASE_CHANGED: ${{ needs.detect-changes.outputs.base_changed }}
          RUN_BUILDS: ${{ needs.detect-changes.outputs.run_builds }}
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        run: |
          if [ "${OVERRIDE}" = "force_unchanged" ]; then
            BASE_CHANGED=false
          fi
          if [ "$RUN_BUILDS" != true ]; then
            echo 'openclaw_base=false' >> "$GITHUB_OUTPUT"
          elif [ "$OVERRIDE" = force_rebuild ] || [ "$BASE_CHANGED" = true ] || \
               { [ "$UNTRUSTED_PR" = true ] && [ -z "$REGISTRY_USERNAME" ]; }; then
            echo 'openclaw_base=true' >> "$GITHUB_OUTPUT"
          else
            BASE_TAG=$(sed -n 's/^OPENCLAW_BASE_TAG=//p' hack/versions.env)
            python3 hack/ci-base-image.py \
              "higress-registry.cn-hangzhou.cr.aliyuncs.com/agentteams/openclaw-base:$BASE_TAG"
          fi

  deepseek-harness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check integration scheduling
        run: |
          python3 tests/check-integration-scheduling.py
          python3 tests/test-ci-release-tools.py
          python3 tests/test-install-mc.py
          python3 tests/test-release-metrics.py

      - name: Run DeepSeek Harness bridge tests
        run: |
          python3 -m unittest discover -s deepseek-harness/tests -p 'test_*.py' -v
          node --test deepseek-harness/tests/*.test.mjs

  mcp-setup-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check MCP setup and Console session handling
        run: |
          python3 -m unittest discover -s manager/tests -p 'test_mcp*.py' -v
          bash tests/check-mcp-setup-domain-parsing.sh

  worker-file-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check Worker config pull and workspace upload
        run: |
          bash shared/tests/test-worker-file-sync.sh
          bash shared/tests/test-merge-openclaw-config.sh

  # Step 1a: Build the shared base image (agentteams-controller)
  build-base:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agentteams-controller
        run: |
          # Override HIGRESS_REGISTRY to the us-west mirror — the default
          # cn-hangzhou registry is unreachable from GitHub-hosted runners
          # (frequently times out on `docker pull`).
          make build-agentteams-controller \
            HIGRESS_REGISTRY=higress-registry.us-west-1.cr.aliyuncs.com \
            DOCKER_BUILD_ARGS="--build-arg APT_MIRROR="

      - name: Save image
        run: |
          docker save agentteams/agentteams-controller:latest | gzip > /tmp/agentteams-controller.tar.gz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image-controller
          path: /tmp/agentteams-controller.tar.gz
          retention-days: 1

  # Step 1b: Compile a changed or genuinely missing prerequisite once.
  # Otherwise all consumers use the immutable published index resolved above.
  build-openclaw-base:
    needs: resolve-openclaw-base
    if: needs.resolve-openclaw-base.outputs.openclaw_base == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build openclaw-base (local tag)
        uses: docker/build-push-action@v7
        with:
          context: ./openclaw-base
          load: true
          tags: agentteams/openclaw-base:latest
          build-args: |
            HIGRESS_REGISTRY=higress-registry.us-west-1.cr.aliyuncs.com
            APT_MIRROR=
          cache-from: type=gha,scope=openclaw-base-amd64
          cache-to: type=gha,mode=max,scope=openclaw-base-amd64,ignore-error=true,timeout=2m

      - name: Save image
        run: |
          docker save agentteams/openclaw-base:latest | gzip > /tmp/agentteams-openclaw-base.tar.gz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image-openclaw-base
          path: /tmp/agentteams-openclaw-base.tar.gz
          retention-days: 1

  # Each group waits only for the images its Dockerfiles actually consume.
  build-images-independent:
    needs: [detect-changes, build-base]
    if: needs.detect-changes.outputs.run_builds == 'true'
    uses: ./.github/workflows/build-integration-images.yml
    with:
      targets: '["qwenpaw-worker", "deepseek-harness-worker"]'
      controller: true
    secrets: inherit

  build-images-controller:
    needs: [detect-changes, build-base]
    if: needs.detect-changes.outputs.run_builds == 'true'
    uses: ./.github/workflows/build-integration-images.yml
    with:
      targets: '["embedded", "manager-qwenpaw", "hermes-worker"]'
      controller: true
    secrets: inherit

  build-images-openclaw:
    needs: [detect-changes, resolve-openclaw-base, build-base, build-openclaw-base]
    if: |
      always() && needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.run_builds == 'true' &&
      needs.resolve-openclaw-base.result == 'success' &&
      needs.build-base.result == 'success' &&
      (needs.build-openclaw-base.result == 'success' || needs.build-openclaw-base.result == 'skipped')
    uses: ./.github/workflows/build-integration-images.yml
    with:
      targets: '["manager", "worker"]'
      controller: true
      local_openclaw_base: ${{ needs.resolve-openclaw-base.outputs.openclaw_base == 'true' }}
      published_base_ref: ${{ needs.resolve-openclaw-base.outputs.openclaw_base_ref }}
    secrets: inherit

  # Step 3: Run test shards in parallel, each on its own runner with isolated cluster
  integration-tests:
    needs: [detect-changes, deepseek-harness-tests, build-images-independent, build-images-controller, build-images-openclaw]
    if: |
      always() && needs.detect-changes.result == 'success' && needs.deepseek-harness-tests.result == 'success' &&
      needs.build-images-independent.result == 'success' &&
      needs.build-images-controller.result == 'success' &&
      needs.build-images-openclaw.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      # Fork PR runs receive no repository secrets; gate the registry login on
      # credential availability. The pinned legacy image is also anonymously
      # pullable from the cn-hangzhou primary, so credential-less runs can
      # still attempt it and skip with a note when unreachable.
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.test_matrix) }}

    steps:
      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to Higress registry (when credentials are available)
        if: env.REGISTRY_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: higress-registry.cn-hangzhou.cr.aliyuncs.com
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Consumer docker-save archives already include their base layers.
      # image-openclaw-base is only needed by the image-building jobs.
      - name: Download runtime images
        id: download-images
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: image-!(openclaw-base)
          path: /tmp/images

      # download-artifact can end a large transfer without reporting an error
      # (a stalled chunk, a runner-side network reset). The truncated tar.gz
      # then only surfaces much later as an opaque gzip "unexpected end of
      # file" inside docker load. Verify every archive here, and retry the
      # whole download once before failing the shard.
      - name: Verify image archives
        id: verify-images
        continue-on-error: true
        run: |
          broken=0
          shopt -s nullglob
          archives=(/tmp/images/image-*/*.tar.gz)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "no image archives were downloaded" >&2
            exit 1
          fi
          for f in "${archives[@]}"; do
            if ! gzip -t "$f"; then
              echo "::warning file=$f::truncated image archive"
              broken=1
            fi
          done
          if [ "${broken}" -ne 0 ]; then
            echo "one or more image archives are truncated" >&2
            exit 1
          fi

      - name: Reset the image download directory
        if: steps.download-images.outcome == 'failure' || steps.verify-images.outcome == 'failure'
        run: rm -rf /tmp/images && mkdir -p /tmp/images

      - name: Retry the image download once
        if: steps.download-images.outcome == 'failure' || steps.verify-images.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          pattern: image-!(openclaw-base)
          path: /tmp/images

      - name: Verify image archives after the retry
        if: steps.download-images.outcome == 'failure' || steps.verify-images.outcome == 'failure'
        run: |
          shopt -s nullglob
          archives=(/tmp/images/image-*/*.tar.gz)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "no image archives were downloaded" >&2
            exit 1
          fi
          for f in "${archives[@]}"; do
            gzip -t "$f"
          done

      - name: Load images
        run: |
          for f in /tmp/images/image-*/*.tar.gz; do
            gunzip -c "$f" | docker load
          done

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl unzip
      - name: Control UI device-identity policy (HTTP/LAN entries)
        # #1460/#1479: the gateway requires a device identity on the Control UI
        # handshake. Runs one real gateway from the manager image this shard
        # already loaded (the manager image is FROM the pinned openclaw-base),
        # so the probe tests the shipped pairing and needs no extra pull; the
        # script asserts that gateway version == the pin in hack/versions.env.
        if: matrix.shard == 'controller-cr' && matrix.manager_runtime == 'openclaw' && matrix.worker_runtime == 'openclaw'
        env:
          OPENCLAW_BASE_IMAGE: agentteams/manager:latest
        run: bash manager/tests/test-control-ui-device-identity.sh


      - name: Configure registry-dependent coverage
        run: |
          if [ -z "${REGISTRY_USERNAME}" ]; then
            echo "COPAW_LEGACY_IMAGE_OPTIONAL=1" >> "$GITHUB_ENV"
            # Credential-less runs (fork PRs) cannot pull the pinned legacy
            # image anonymously. Point the embedded install's copaw slot at
            # a locally-built worker image so the install skips the pull:
            # no test in this run actually starts a CoPaw worker (test-23
            # rejects the copaw switch; test-29 skips via
            # COPAW_LEGACY_IMAGE_OPTIONAL).
            echo "CI_COPAW_WORKER_IMAGE=agentteams/agentteams-harness-qwenpaw:latest" >> "$GITHUB_ENV"
            echo "::notice::Registry credentials unavailable in this run — the legacy-upgrade test (29) will skip, and the copaw install slot uses a local placeholder image."
          else
            echo "COPAW_LEGACY_IMAGE_OPTIONAL=0" >> "$GITHUB_ENV"
            echo "CI_COPAW_WORKER_IMAGE=higress-registry.cn-hangzhou.cr.aliyuncs.com/agentteams/agentteams-copaw-worker:v1.2.4" >> "$GITHUB_ENV"
          fi

      - name: Run embedded integration tests
        id: tests
        env:
          AGENTTEAMS_LLM_API_KEY: ${{ secrets.AGENTTEAMS_LLM_API_KEY }}
          AGENTTEAMS_LLM_PROVIDER: qwen
          AGENTTEAMS_DEFAULT_MODEL: ${{ inputs.model || 'qwen3.6-plus' }}
          AGENTTEAMS_MANAGER_RUNTIME: ${{ matrix.manager_runtime }}
          # Exercise the PR-built QwenPaw Manager directly.
          AGENTTEAMS_INSTALL_MANAGER_QWENPAW_IMAGE: agentteams/manager-qwenpaw:latest
          # Propagate the worker runtime to worker-creating tests too. Without
          # this the apply-zip path (test-15) silently falls back to openclaw
          # on the qwenpaw and hermes matrix entries because the controller's
          # backend resolves an empty req.Runtime to RuntimeOpenClaw — which
          # would make those dimensions run hidden openclaw workers and
          # invalidate the parallel-runtime coverage we set up above.
          AGENTTEAMS_DEFAULT_WORKER_RUNTIME: ${{ matrix.worker_runtime }}
        run: |
          if [ -z "${AGENTTEAMS_LLM_API_KEY}" ] && [ "${{ matrix.requires_secret }}" = "false" ]; then
            export AGENTTEAMS_LLM_API_KEY="ci-no-llm-placeholder"
            export AGENTTEAMS_CI_NO_LLM=1
          fi
          FILTER="${{ github.event.inputs.test_filter }}"
          if [ -z "$FILTER" ]; then
            FILTER="${{ env[matrix.filter_env] }}"
          fi
          # The branch no longer builds copaw-worker; resolve the embedded
          # install's legacy image from the pinned published source instead
          # of the (unavailable) local build tag.
          # LOCAL_COPAW_WORKER must be a make command-line variable (after
          # 'make'): the Makefile assigns it unconditionally ('='), so a
          # shell env prefix is silently ignored and the install would pull
          # the default agentteams/copaw-worker:latest, which this branch
          # no longer builds. AGENTTEAMS_VERSION/SKIP_BUILD stay env
          # prefixes because the install script (not make) consumes them.
          AGENTTEAMS_VERSION=v1.2.0-beta.1 SKIP_BUILD=1 \
          make test-embedded \
            LOCAL_COPAW_WORKER="${CI_COPAW_WORKER_IMAGE}" \
            TEST_FILTER="$FILTER"

      # ============================================================
      # Metrics: download latest release baseline for comparison
      # ============================================================

      - name: Download latest release baseline
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && matrix.shard == 'llm-interaction' && matrix.manager_runtime == 'openclaw' && matrix.worker_runtime == 'openclaw'
        continue-on-error: true
        run: |
          mkdir -p baseline-metrics
          # Find latest release with a metrics-baseline.json asset
          # Note: gh release list --json does not support the "assets" field,
          # so we use the GitHub API directly.
          LATEST=$(gh api repos/${{ github.repository }}/releases --paginate --jq \
            '[.[] | select(.assets | map(.name) | any(. == "metrics-baseline.json"))] | .[0].tag_name' \
            2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$LATEST" != "null" ]; then
            echo "Downloading baseline from release $LATEST"
            gh release download "$LATEST" --pattern "metrics-baseline.json" --dir baseline-metrics --repo "${{ github.repository }}"
          else
            echo "No release baseline found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metrics comparison and post PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && matrix.shard == 'llm-interaction' && matrix.manager_runtime == 'openclaw' && matrix.worker_runtime == 'openclaw'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source tests/lib/agent-metrics.sh

          # Collect current summary across all tests that ran
          FILTER="${{ github.event.inputs.test_filter }}"
          if [ -z "$FILTER" ]; then
            FILTER="${{ env[matrix.filter_env] }}"
          fi
          TEST_NAMES=$(echo "$FILTER" | tr ' ' '\n' | while read n; do
            f=$(ls tests/output/metrics-*${n}*.json 2>/dev/null | head -1)
            [ -n "$f" ] && basename "$f" .json | sed 's/^metrics-//'
          done | tr '\n' ' ')

          CURRENT=$(generate_metrics_summary $TEST_NAMES)

          BASELINE=""
          if [ -f "baseline-metrics/metrics-baseline.json" ]; then
            BASELINE=$(cat baseline-metrics/metrics-baseline.json)
          fi

          COMPARISON=$(compare_metrics_with_baseline "$CURRENT" "$BASELINE")
          REPORT=$(generate_comparison_markdown "$COMPARISON")

          # Append debug log artifact link
          ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPORT="${REPORT}

          ---
          📦 [Download debug logs & test artifacts](${ARTIFACT_URL}#artifacts)"

          mkdir -p tests/output
          echo "$COMPARISON" > tests/output/metrics-comparison.json
          echo "$REPORT" > tests/output/metrics-report.md

          PR_NUM="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUM/comments" \
            --jq '.[] | select(.body | startswith("## 📊 CI Metrics Report")) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$REPORT"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUM/comments" -f body="$REPORT"
          fi

      # ============================================================
      # Artifacts
      # ============================================================

      - name: Export debug logs
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/export-debug-log.py --range 2h --no-redact
          DEBUG_DIR=$(ls -td debug-log/*/ 2>/dev/null | head -1)
          if [ -n "$DEBUG_DIR" ]; then
            echo "Debug log exported: $DEBUG_DIR"
          else
            echo "No debug logs generated"
          fi

      - name: Post failure comment to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          ARTIFACT_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"

          # Collect test result summary
          TEST_SUMMARY=""
          if ls tests/output/result-*.txt 1>/dev/null 2>&1; then
            TEST_SUMMARY=$(cat tests/output/result-*.txt 2>/dev/null | head -50)
          fi

          # Collect debug log tail
          DEBUG_TAIL=""
          DEBUG_DIR=$(ls -td debug-log/*/ 2>/dev/null | head -1)
          if [ -n "$DEBUG_DIR" ]; then
            # Get the last 80 lines from agent logs
            DEBUG_TAIL=$(find "$DEBUG_DIR" -name "*.log" -exec tail -20 {} + 2>/dev/null | tail -80)
          fi

          BODY="## ❌ Integration Tests Failed (${{ matrix.shard }} / mgr=${{ matrix.manager_runtime }} / wk=${{ matrix.worker_runtime }})

          **Commit:** ${{ github.event.pull_request.head.sha }}
          **Workflow run:** [#${{ github.run_number }}](${ARTIFACT_URL})

          <details>
          <summary>Test Results</summary>

          \`\`\`
          ${TEST_SUMMARY:-No test output captured.}
          \`\`\`

          </details>

          <details>
          <summary>Debug Log (tail)</summary>

          \`\`\`
          ${DEBUG_TAIL:-No debug logs available.}
          \`\`\`

          </details>

          ---
          📦 [Download full debug logs & test artifacts](${ARTIFACT_URL}#artifacts)"

          # Update or create comment
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUM/comments" \
            --jq '.[] | select(.body | startswith("## ❌ Integration Tests Failed (${{ matrix.shard }} / mgr=${{ matrix.manager_runtime }} / wk=${{ matrix.worker_runtime }})")) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUM/comments" -f body="$BODY"
          fi

      - name: Collect test artifacts
        if: always()
        run: |
          mkdir -p test-artifacts
          [ -d "tests/output" ] && cp -r tests/output/* test-artifacts/ 2>/dev/null || true
          [ -d "debug-log" ] && cp -r debug-log test-artifacts/debug-log 2>/dev/null || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.shard }}-mgr-${{ matrix.manager_runtime }}-wk-${{ matrix.worker_runtime }}-${{ github.sha }}
          path: test-artifacts/
          retention-days: 7

      # ============================================================
      # Release baseline: generate and upload on tag push
      # ============================================================

      - name: Generate release baseline
        if: startsWith(github.ref, 'refs/tags/v') && matrix.shard == 'llm-interaction' && matrix.manager_runtime == 'openclaw' && matrix.worker_runtime == 'openclaw'
        run: |
          source tests/lib/agent-metrics.sh
          TEST_NAMES=$(echo "$NON_GITHUB_TESTS" | tr ' ' '\n' | while read n; do
            f=$(ls tests/output/metrics-*${n}*.json 2>/dev/null | head -1)
            [ -n "$f" ] && basename "$f" .json | sed 's/^metrics-//'
          done | tr '\n' ' ')
          generate_metrics_summary $TEST_NAMES > metrics-baseline.json
          echo "Baseline generated for ${GITHUB_REF_NAME}"
          cat metrics-baseline.json | jq '{totals: .totals, by_role: .by_role}'

      - name: Upload baseline to release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.shard == 'llm-interaction' && matrix.manager_runtime == 'openclaw' && matrix.worker_runtime == 'openclaw'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" metrics-baseline.json \
            --repo "${{ github.repository }}" --clobber
          echo "✅ Baseline uploaded to release ${GITHUB_REF_NAME}"

      - name: Upload debug log to release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.shard == 'llm-interaction' && matrix.manager_runtime == 'openclaw' && matrix.worker_runtime == 'openclaw' && always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d debug-log ]; then
            cd debug-log && zip -r ../debug-log.zip . && cd ..
            gh release upload "${GITHUB_REF_NAME}" debug-log.zip \
              --repo "${{ github.repository }}" --clobber
            echo "✅ Debug log uploaded to release ${GITHUB_REF_NAME}"
          fi

      - name: Cleanup
        if: always()
        run: make uninstall-embedded 2>/dev/null || true && docker system prune -af || true

      - name: Test Summary
        if: always()
        run: |
          echo "### Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Shard: \`${{ matrix.shard }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: \`${{ env[matrix.filter_env] }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Manager Runtime: \`${{ matrix.manager_runtime }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Worker Runtime: \`${{ matrix.worker_runtime }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Model: \`${{ inputs.model || 'qwen3.6-plus' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Install Mode: embedded (make test-embedded)" >> $GITHUB_STEP_SUMMARY

# ============================================================
# Manual baseline re-generation for a specific release version
# ============================================================

  release-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.baseline_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Resolve target version
        id: version
        run: |
          echo "version=${{ inputs.baseline_version }}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ steps.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl unzip

      - name: Pull published images
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Use the us-west mirror — the cn-hangzhou registry is unreachable
          # from GitHub-hosted runners (frequently times out on `docker pull`).
          # Published images are auto-mirrored from cn-hangzhou to us-west-1.
          REGISTRY=higress-registry.us-west-1.cr.aliyuncs.com/agentteams
          WORKER_REPOSITORY=agentteams-harness-openclaw
          if [ "$(printf '%s\n' v1.2.7 "${VERSION}" | sort -V | head -1)" != v1.2.7 ]; then
            WORKER_REPOSITORY=agentteams-worker
          fi
          docker pull ${REGISTRY}/agentteams-manager:${VERSION}
          docker pull ${REGISTRY}/${WORKER_REPOSITORY}:${VERSION}
          docker pull ${REGISTRY}/agentteams-controller:${VERSION}
          docker tag ${REGISTRY}/agentteams-manager:${VERSION} agentteams/manager:${VERSION}
          docker tag ${REGISTRY}/${WORKER_REPOSITORY}:${VERSION} agentteams/agentteams-harness-openclaw:${VERSION}
          docker tag ${REGISTRY}/agentteams-controller:${VERSION} agentteams/agentteams-controller:${VERSION}

      - name: Install AgentTeams
        env:
          AGENTTEAMS_LLM_API_KEY: ${{ secrets.AGENTTEAMS_LLM_API_KEY }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          AGENTTEAMS_NON_INTERACTIVE=1 \
          AGENTTEAMS_VERSION=$VERSION \
          AGENTTEAMS_MOUNT_SOCKET=1 \
          AGENTTEAMS_MATRIX_E2EE=0 \
          AGENTTEAMS_LLM_PROVIDER=qwen \
          AGENTTEAMS_INSTALL_MANAGER_IMAGE=agentteams/manager:${VERSION} \
          AGENTTEAMS_INSTALL_WORKER_IMAGE=agentteams/agentteams-harness-openclaw:${VERSION} \
          AGENTTEAMS_INSTALL_CONTROLLER_IMAGE=agentteams/agentteams-controller:${VERSION} \
          bash ./install/agentteams-install.sh manager

      - name: Wait for Manager to be ready
        run: |
          for i in {1..60}; do
            if docker exec agentteams-manager curl -sf http://127.0.0.1:8001/ >/dev/null 2>&1; then
              if docker exec agentteams-manager curl -sf http://127.0.0.1:6167/_matrix/client/versions >/dev/null 2>&1; then
                echo "Manager ready, waiting 60s for agent initialization..."
                sleep 60
                exit 0
              fi
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          exit 1

      - name: Enable YOLO mode
        run: docker exec agentteams-manager touch /root/manager-workspace/yolo-mode

      - name: Run integration tests
        env:
          AGENTTEAMS_LLM_API_KEY: ${{ secrets.AGENTTEAMS_LLM_API_KEY }}
        run: |
          TEST_GATEWAY_PORT=18080 TEST_CONSOLE_PORT=18001 TEST_MANAGER_CONTAINER=agentteams-manager \
            ./tests/run-all-tests.sh --skip-build --use-existing --test-filter "$NON_GITHUB_TESTS"

      - name: Generate release baseline
        run: |
          VERSION=${{ steps.version.outputs.version }}
          source tests/lib/agent-metrics.sh
          TEST_NAMES=$(echo "$NON_GITHUB_TESTS" | tr ' ' '\n' | while read n; do
            f=$(ls tests/output/metrics-*${n}*.json 2>/dev/null | head -1)
            [ -n "$f" ] && basename "$f" .json | sed 's/^metrics-//'
          done | tr '\n' ' ')
          generate_metrics_summary $TEST_NAMES > metrics-baseline.json
          echo "Baseline generated for version ${VERSION}"
          cat metrics-baseline.json | jq '{totals: .totals, by_role: .by_role}'

      - name: Export debug logs
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/export-debug-log.py --range 2h --no-redact
          DEBUG_DIR=$(ls -td debug-log/*/ 2>/dev/null | head -1)
          if [ -n "$DEBUG_DIR" ]; then
            cd debug-log && zip -r ../debug-log.zip . && cd ..
            echo "Debug log exported: $(du -sh debug-log.zip | cut -f1)"
          else
            echo "No debug logs generated"
          fi

      - name: Upload baseline to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release upload "${VERSION}" metrics-baseline.json \
            --repo "${{ github.repository }}" --clobber
          echo "✅ Baseline uploaded to release ${VERSION}"

      - name: Upload debug log to release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if [ -f debug-log.zip ]; then
            gh release upload "${VERSION}" debug-log.zip \
              --repo "${{ github.repository }}" --clobber
            echo "✅ Debug log uploaded to release ${VERSION}"
          else
            echo "No debug log to upload"
          fi

      - name: Cleanup
        if: always()
        run: make uninstall-embedded 2>/dev/null || true && docker system prune -af || true

  install-verify-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run the LLM-smoke regression suite (stubbed docker/curl)
        run: bash install/tests/verify-llm-regressions.sh

      - name: Run the OpenClaw version-guard regression (stubbed fs/node)
        run: bash manager/tests/test-openclaw-version-guard.sh

      - name: Run the Control UI pin-assertion regression (stubbed docker)
        run: bash manager/tests/test-control-ui-version-assert.sh

  install-upgrade-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run the upgrade CLI regression suite (stubbed docker/agt)
        run: bash install/tests/test-upgrade-cli.sh

      - name: Run the console-approval hint literal-print regression (stubbed docker)
        # #1460: the upgrade's device-approval hint must print its command
        # examples literally - backticks in the double-quoted log line would
        # execute them while printing. Pure bash + stubbed docker, no engine.
        run: bash install/tests/test-upgrade-console-hint.sh

      - name: Run the live boundary-preservation regression (real engine)
        run: |
          if docker info >/dev/null 2>&1; then
            bash install/tests/test-upgrade-preserve-live.sh
          else
            echo "SKIP live boundary test (no docker)"
          fi

# ============================================================
# Offline pre-flight suite: qwenpaw upgrade checker (AgentTeams#1341)
# No Docker or network needed - builds miniature trees and a fake wheel.
# ============================================================

  qwenpaw-upgrade-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the checker's version-parsing dependency
        # The pre-flight checker imports `packaging` (version comparison); a
        # bare setup-python runner does not ship it, so install it before the
        # offline suite runs.
        run: python3 -m pip install --quiet packaging

      - name: Run the offline pre-flight suite
        run: python3 qwenpaw/tests/test_check_qwenpaw_upgrade.py

# ============================================================
# In-place upgrade orchestrator battery (AgentTeams#1341 lifecycle S3-S6)
# Fully stubbed (--selftest): no Docker, no network, no package changes.
# ============================================================

  qwenpaw-runtime-upgrade:
    runs-on: ubuntu-latest
    # Every step below carries its own wall-clock bound, so a stall fails AT
    # that step (exit 124, step named in the log) instead of silently consuming
    # the job budget: the previous shape had no per-step bound, so a cancelled
    # run left nothing to point at. The repo-side work measures ~35 s
    # (selftest) and ~75 s (the 41-test battery) — a healthy run is ~2-3 min;
    # the job budget covers the three step bounds (150+210+270 = 630 s) plus
    # checkout / setup-python overhead.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run the in-place upgrade battery (stubbed selftest)
        run: timeout 150 bash qwenpaw/scripts/upgrade_qwenpaw_runtime.sh --selftest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the upgrade test-suite dependencies
        # The plugin tests load the real plugin module (fastapi/pydantic);
        # the version tests use packaging for PEP440 comparison. Bounded, with
        # retries, so a registry hiccup surfaces here rather than stalling the
        # whole job.
        run: timeout 210 python3 -m pip install --quiet --timeout 20 --retries 2 pytest packaging fastapi pydantic

      - name: Run the upgrade pytest battery (orchestrator / versions / plugin / entrypoint)
        # Fully stubbed: fake orchestrator hooks, fake worker, no network.
        # -v names every test as it starts, so a stall points at the test it is
        # stuck in; --durations surfaces anything unexpectedly slow.
        run: >
          timeout 270 python3 -m pytest -v --durations=10
          qwenpaw/tests/test_upgrade_orchestrator.py
          qwenpaw/tests/test_upgrade_versions.py
          qwenpaw/tests/test_upgrade_plugin.py
          qwenpaw/tests/test_upgrade_entrypoint.py
