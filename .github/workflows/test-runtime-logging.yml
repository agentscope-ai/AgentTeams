name: Runtime logging
on:
  pull_request:
    paths:
      - 'shared/lib/runtime_*.py'
      - 'shared/lib/agentteams-env.sh'
      - 'shared/lib/telemetry/**'
      - 'manager/tests/test_runtime_observability.py'
      - 'tests/test_worker_full_telemetry.py'
      - '.github/workflows/test-runtime-logging.yml'
  push:
    branches: [main]
    paths:
      - 'shared/lib/runtime_*.py'
      - 'shared/lib/agentteams-env.sh'
      - 'shared/lib/telemetry/**'
      - 'manager/tests/test_runtime_observability.py'
      - 'tests/test_worker_full_telemetry.py'
      - '.github/workflows/test-runtime-logging.yml'
permissions:
  contents: read
jobs:
  logging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r shared/lib/telemetry/requirements.txt openai==3.46.0 pytest
      - run: python -m unittest discover -s manager/tests -p test_runtime_observability.py -v
      - run: python -m pytest tests/test_worker_telemetry.py tests/test_worker_full_telemetry.py tests/test_task_trace_mcp.py -q
