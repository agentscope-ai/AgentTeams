{{- if and .Values.deepagents.enabled (not .Values.deepagents.checkpoint.existingSecret) }}
{{- $name := include "agentteams.deepagents.checkpointSecretName" . }}
{{- $existing := lookup "v1" "Secret" (include "agentteams.namespace" .) $name }}
{{- $dsnKey := .Values.deepagents.checkpoint.dsnKey }}
{{- $aesKeyKey := .Values.deepagents.checkpoint.aesKeyKey }}
{{- $passwordKey := .Values.deepagents.checkpoint.postgresPasswordKey }}
{{- $password := .Values.deepagents.postgresql.auth.password | default (randAlphaNum 32) }}
{{- $aesKey := .Values.deepagents.checkpoint.aesKey | default (randAlphaNum 32) }}
{{- if $existing }}
  {{- $password = (get $existing.data $passwordKey | default "" | b64dec) | default $password }}
  {{- $aesKey = (get $existing.data $aesKeyKey | default "" | b64dec) | default $aesKey }}
{{- end }}
{{- $dsn := .Values.deepagents.checkpoint.dsn }}
{{- if and (not $dsn) .Values.deepagents.postgresql.enabled }}
  {{- $encodedUser := .Values.deepagents.postgresql.auth.username | urlquery | replace "+" "%20" }}
  {{- $encodedPassword := $password | urlquery | replace "+" "%20" }}
  {{- $encodedDatabase := .Values.deepagents.postgresql.auth.database | urlquery | replace "+" "%20" }}
  {{- $dsn = printf "postgresql://%s:%s@%s:5432/%s?sslmode=disable" $encodedUser $encodedPassword (include "agentteams.deepagents.postgresqlFullname" .) $encodedDatabase }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "agentteams.namespace" . }}
  labels:
    {{- include "agentteams.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $dsnKey }}: {{ $dsn | quote }}
  {{ $aesKeyKey }}: {{ $aesKey | quote }}
  {{ $passwordKey }}: {{ $password | quote }}
{{- end }}
