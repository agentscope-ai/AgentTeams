            'pytest>=8.3,<10' \
            'pytest-asyncio>=0.23,<2'

      - name: Run mention localpart tests
        run: |
          python -m pytest plugins/tests/agentteams-matrix-channel/test_mention_localpart.py -q

  matrix-channel-send-gate-retrigger-relevance:
