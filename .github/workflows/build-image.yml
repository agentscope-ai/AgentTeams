name: Build one image

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
  REPO: agentteams

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Up GitHub Actions Ubuntu Runner Disk Space 🔧
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          # The caller has already published the Controller dependency.
          # Preserve Makefile dependencies for local builds, but do not rebuild it here.
          args=()
          if [[ "$TARGET" == embedded || "$TARGET" == manager ]]; then
            args+=(-o push-agentteams-controller)
          fi
          make "${args[@]}" "push-${TARGET}" \
            VERSION="$VERSION" \
            OPENCLAW_BASE_VERSION="$VERSION" \
            REGISTRY="$REGISTRY" \
            REPO="$REPO" \
            HIGRESS_REGISTRY=higress-registry.us-west-1.cr.aliyuncs.com \
            DOCKER_BUILD_ARGS="--build-arg APT_MIRROR= --build-arg PIP_INDEX_URL=https://pypi.org/simple/"

      - name: Summary
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "Built ${TARGET}:${VERSION} for linux/amd64 and linux/arm64" >> "$GITHUB_STEP_SUMMARY"
