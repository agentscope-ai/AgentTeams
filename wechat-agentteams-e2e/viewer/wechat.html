<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>模拟微信群 · ServiceDesk Pilot</title>
<style>
  :root {
    --bg: #ededed;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #9aa0a6;
    --line: #e5e7eb;
    --brand: #07c160;       /* 微信绿 */
    --brand-ink: #1aad19;
    --bubble-in: #ffffff;
    --bubble-out: #95ec69;  /* 微信发出气泡 */
    --sys: #b2b2b2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header.bar {
    background: #f7f7f7; border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; align-items: center; gap: 10px;
    -webkit-app-region: drag;
  }
  header.bar .back {
    width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
    color: #333; text-decoration: none; font-size: 18px; background: #ececec;
  }
  header.bar .title { flex: 1; text-align: center; font-size: 15px; font-weight: 600; }
  header.bar .conn { font-size: 12px; color: var(--muted); min-width: 78px; text-align: right; }
  header.bar .conn.live { color: var(--brand-ink); }

  .chat { flex: 1; overflow-y: auto; padding: 14px 12px; }
  .msg { display: flex; margin-bottom: 14px; align-items: flex-start; gap: 9px; }
  .msg .avatar {
    width: 38px; height: 38px; border-radius: 6px; flex: none;
    display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 14px;
    background: #5b8def;
  }
  .msg .col { max-width: 72%; display: flex; flex-direction: column; gap: 4px; }
  .msg .name { font-size: 12px; color: var(--muted); padding-left: 2px; }
  .bubble {
    position: relative; padding: 9px 12px; border-radius: 6px; background: var(--bubble-in);
    font-size: 14.5px; line-height: 1.55; word-break: break-word; white-space: pre-wrap;
    box-shadow: 0 1px 1px rgba(0,0,0,.04);
  }
  .bubble::before {
    content: ""; position: absolute; top: 12px; left: -5px; border: 6px solid transparent;
    border-right-color: var(--bubble-in); border-left: 0;
  }
  /* 发出（机器人/服务台助手） */
  .msg.out { flex-direction: row-reverse; }
  .msg.out .avatar { background: var(--brand); }
  .msg.out .col { align-items: flex-end; }
  .msg.out .bubble { background: var(--bubble-out); }
  .msg.out .bubble::before {
    left: auto; right: -5px; border-right: 0; border-left-color: var(--bubble-out);
  }
  /* 系统/处理中 */
  .sys { text-align: center; margin: 10px 0; }
  .sys span {
    display: inline-block; background: rgba(0,0,0,.06); color: var(--sys);
    font-size: 12px; padding: 3px 10px; border-radius: 5px; max-width: 90%;
  }

  .composer {
    border-top: 1px solid var(--line); background: #f7f7f7; padding: 10px 12px;
    display: flex; gap: 8px; align-items: center;
  }
  .composer input {
    flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px;
    font-size: 14px; background: #fff; outline: none;
  }
  .composer input:focus { border-color: var(--brand); }
  .composer button {
    border: 0; background: var(--brand); color: #fff; font-size: 14px; font-weight: 600;
    padding: 9px 16px; border-radius: 8px; cursor: pointer;
  }
  .composer button:disabled { opacity: .5; cursor: not-allowed; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="index.html" title="返回总览">‹</a>
  <div class="title" id="group-title">微信群-IT服务台支持群</div>
  <div class="conn" id="conn">连接中</div>
</header>

<div class="chat" id="chat">
  <div class="empty" id="empty">等待真实群消息……（由宿主机模拟器推送，经容器 Agent Team 处理后回传）</div>
</div>

<div class="composer">
  <input id="text" type="text" placeholder="以「访客」身份发一条群消息（真实写入容器）" />
  <button id="send">发送</button>
</div>

<script>
  const chat = document.getElementById("chat");
  const empty = document.getElementById("empty");
  const connEl = document.getElementById("conn");
  const titleEl = document.getElementById("group-title");
  let cursor = 0;

  function avatarText(name) {
    if (!name) return "?";
    return name.replace(/[@:]/g, "").slice(0, 2);
  }
  function fmtTs(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  }

  function addEvent(ev) {
    if (empty) { empty.remove(); }
    if (ev.kind === "wechat_inbound") {
      const w = ev.wechat || {};
      appendMsg({
        side: "in", name: w.sender || "群成员",
        text: w.text || ev.body, ts: ev.ts, avatar: avatarText(w.sender)
      });
    } else if (ev.kind === "wechat_reply") {
      appendMsg({
        side: "out", name: "IT服务台助手",
        text: ev.display_text || ev.body, ts: ev.ts, avatar: "台"
      });
    } else if (ev.kind === "gateway_progress") {
      appendSys(ev.display_text || ev.body, ev.ts);
    }
  }

  function appendMsg({ side, name, text, ts, avatar }) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + (side === "out" ? "out" : "in");
    wrap.innerHTML =
      '<div class="avatar">' + escapeHtml(avatar) + '</div>' +
      '<div class="col">' +
        (side === "in" ? '<div class="name">' + escapeHtml(name) + ' · ' + fmtTs(ts) + '</div>' : '') +
        '<div class="bubble">' + escapeHtml(text) + '</div>' +
        (side === "out" ? '<div class="name">' + fmtTs(ts) + '</div>' : '') +
      '</div>';
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function appendSys(text, ts) {
    const el = document.createElement("div");
    el.className = "sys";
    el.innerHTML = '<span>⏳ ' + escapeHtml(text) + ' · ' + fmtTs(ts) + '</span>';
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function poll() {
    try {
      const r = await fetch("/api/events?since=" + cursor);
      const data = await r.json();
      if (data.status) {
        titleEl.textContent = data.status.gateway_room_name || titleEl.textContent;
        if (data.status.connected) {
          connEl.textContent = "● 实时"; connEl.className = "conn live";
        } else {
          connEl.textContent = "未连接"; connEl.className = "conn";
        }
      }
      for (const ev of (data.events || [])) addEvent(ev);
      if (data.cursor) cursor = data.cursor;
    } catch (e) {
      connEl.textContent = "桥接未启动"; connEl.className = "conn";
    }
  }

  document.getElementById("send").addEventListener("click", async () => {
    const inp = document.getElementById("text");
    const text = inp.value.trim();
    if (!text) return;
    inp.value = "";
    try {
      await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, sender: "访客" })
      });
    } catch (e) { /* 错误会在下一次 poll 体现 */ }
  });
  document.getElementById("text").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("send").click();
  });

  poll();
  setInterval(poll, 2500);
</script>
</body>
</html>
