name: Recover cached native ARM64 OpenClaw base
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
  SOURCE: a5ddf6ae0f6d14797bf14924de12452ab69c3f2a
jobs:
  recover:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Restore completed native build from matching source cache
        uses: docker/build-push-action@v7
        with:
          context: ./openclaw-base
          load: true
          tags: agentteams/openclaw-base:latest
          build-args: |
            HIGRESS_REGISTRY=higress-registry.us-west-1.cr.aliyuncs.com
            APT_MIRROR=
          cache-from: type=gha,scope=openclaw-base-arm64
      - name: Label and smoke the native artifact
        run: |
          image="$REGISTRY/agentteams/openclaw-base:stage-v1.2.8-7e6f68fdafb1-arm64"
          docker build --build-arg INPUT_IMAGE=agentteams/openclaw-base:latest \
            --label "org.opencontainers.image.revision=$SOURCE" --label org.opencontainers.image.version=v1.2.8 \
            --label "io.agentteams.packaging-revision=$GITHUB_SHA" \
            -f scripts/release/128-metadata.Dockerfile -t "$image" .
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          docker run --rm --entrypoint bash "$image" -ec 'node --version; openclaw --version; grep -rFl "com.agentteams.read_audience" /opt/openclaw/dist/extensions/matrix >/dev/null'
          docker save "$image" | gzip > /tmp/openclaw-base-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: verified-openclaw-base-arm64
          path: /tmp/openclaw-base-arm64.tar.gz
          retention-days: 2
      - name: Push with preserved artifact fallback
        run: |
          image="$REGISTRY/agentteams/openclaw-base:stage-v1.2.8-7e6f68fdafb1-arm64"
          timeout 600 docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          ref="${image%:*}@$digest"
          docker pull --platform linux/arm64 "$ref"
          docker run --rm --entrypoint bash "$ref" -ec 'node --version; openclaw --version; grep -rFl "com.agentteams.read_audience" /opt/openclaw/dist/extensions/matrix >/dev/null'
          echo "$ref native ARM64 passed" >> "$GITHUB_STEP_SUMMARY"
