name: Publish shared Harness images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Shared Harness version (for example v1.2.7); does not create a Core tag'
        required: true
        type: string
      publish:
        description: 'Publish final version tags after building and smoke-testing staging images'
        type: boolean
        default: true
      controller_image:
        description: 'Optional immutable shared CLI image; reuse requires identical Controller source'
        type: string
        default: ''
      runtime:
        description: 'Build only one runtime when recovering a failed platform'
        type: choice
        default: all
        options: [all, openclaw, qwenpaw, hermes, deepseek, openhuman, codex, opencode, claudecode]
      architecture:
        description: 'Build only one architecture; partial builds require publish=false'
        type: choice
        default: all
        options: [all, amd64, arm64]

permissions:
  contents: read

concurrency:
  group: publish-harnesses-${{ inputs.version }}-${{ inputs.runtime || 'all' }}-${{ inputs.architecture || 'all' }}
  cancel-in-progress: false

env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
  CODEX_REF: 860b07d4027ea2bd48c0d4f4885b9a9612d1b446
  CLAUDECODE_REF: dbd9613088fd950d25536c95366e0c72016e8979
  OPENCODE_REF: 318d1524535398d67a4a876fe07b966689d57361

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      candidate: ${{ steps.meta.outputs.candidate }}
      runtimes: ${{ steps.meta.outputs.runtimes }}
      architectures: ${{ steps.meta.outputs.architectures }}
    steps:
      - name: Freeze publication identity
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME: ${{ inputs.runtime || 'all' }}
          ARCHITECTURE: ${{ inputs.architecture || 'all' }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$RUNTIME" =~ ^(all|openclaw|qwenpaw|hermes|deepseek|openhuman|codex|opencode|claudecode)$ ]] || exit 1
          [[ "$ARCHITECTURE" =~ ^(all|amd64|arm64)$ ]] || exit 1
          [[ "$PUBLISH" != true || "$ARCHITECTURE" == all ]] || exit 1
          # Experimental Harnesses remain opt-in during admission.
          runtimes='["openclaw","qwenpaw","hermes","deepseek","openhuman","codex"]'
          architectures='["amd64","arm64"]'
          if [[ "$RUNTIME" != all ]]; then runtimes="[\"$RUNTIME\"]"; fi
          if [[ "$ARCHITECTURE" != all ]]; then architectures="[\"$ARCHITECTURE\"]"; fi
          echo "runtimes=$runtimes" >> "$GITHUB_OUTPUT"
          echo "architectures=$architectures" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "candidate=harness-${VERSION}-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

  controller-platform:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build shared CLI and builtin assets on native runner
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          ARCH: ${{ matrix.arch }}
          REUSE_CONTROLLER: ${{ inputs.controller_image }}
        run: |
          image="${REGISTRY}/agentteams/agentteams-controller:${CANDIDATE}-${ARCH}"
          if [[ -n "$REUSE_CONTROLLER" ]]; then
            [[ "$REUSE_CONTROLLER" =~ ^higress-registry.cn-hangzhou.cr.aliyuncs.com/agentteams/agentteams-controller@sha256:[a-f0-9]{64}$ ]]
            docker pull --platform "linux/$ARCH" "$REUSE_CONTROLLER"
            revision=$(docker inspect "$REUSE_CONTROLLER" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
            git diff --exit-code "$revision" HEAD -- agentteams-controller manager/agent
            docker tag "$REUSE_CONTROLLER" "$image"
          else
            make build-agentteams-controller LOCAL_CONTROLLER="$image" DOCKER_PLATFORM="linux/$ARCH" \
              DOCKER_BUILD_ARGS="--label org.opencontainers.image.revision=${GITHUB_SHA}"
          fi
          docker run --rm --entrypoint agt "$image" tracing --help
          docker push "$image"

  controller-index:
    needs: [prepare, controller-platform]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Assemble immutable candidate dependency
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          image="${REGISTRY}/agentteams/agentteams-controller:${CANDIDATE}"
          docker buildx imagetools create -t "$image" "${image}-amd64" "${image}-arm64"

  harness-platform:
    needs: [prepare, controller-index]
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.prepare.outputs.runtimes) }}
        arch: ${{ fromJSON(needs.prepare.outputs.architectures) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        if: matrix.runtime == 'codex'
        with:
          repository: agentteams-group/agentteams-harness-codex
          ref: ${{ env.CODEX_REF }}
          path: codex-harness
      - uses: actions/checkout@v4
        if: matrix.runtime == 'claudecode'
        with:
          repository: agentteams-group/agentteams-harness-claudecode
          ref: ${{ env.CLAUDECODE_REF }}
          path: claudecode-harness
      - uses: actions/checkout@v4
        if: matrix.runtime == 'opencode'
        with:
          repository: agentteams-group/agentteams-harness-opencode
          ref: ${{ env.OPENCODE_REF }}
          path: opencode-harness
      - uses: ruby/setup-ruby@v1
        if: matrix.runtime == 'qwenpaw'
        with:
          ruby-version: '3.3'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build, smoke and push native platform staging image
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          scripts/release/build-harness-platform.sh "$RUNTIME" "${CANDIDATE}-${ARCH}" "linux/$ARCH" \
            "${REGISTRY}/agentteams/agentteams-controller:${CANDIDATE}"

  publish:
    needs: [prepare, harness-platform]
    if: inputs.publish
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.prepare.outputs.runtimes) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Publish verified architecture index without overwriting existing release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          image="${REGISTRY}/agentteams/agentteams-harness-${RUNTIME}"
          final="${image}:${VERSION}"
          if docker buildx imagetools inspect "$final" --raw > manifest.json 2>existing-error.txt; then
            scripts/release/verify-harness-image.sh "$final" "$GITHUB_SHA" "$VERSION" < manifest.json || {
              echo "Refusing to overwrite an unverified existing version $final" >&2
              exit 1
            }
            echo "Reused already verified $final from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif ! grep -qiE 'not found|manifest unknown' existing-error.txt; then
            cat existing-error.txt >&2
            exit 1
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            -t "$final" "${image}:${CANDIDATE}-amd64" "${image}:${CANDIDATE}-arm64"
          docker buildx imagetools inspect "$final" --raw > manifest.json
          scripts/release/verify-harness-image.sh "$final" "$GITHUB_SHA" "$VERSION" < manifest.json
          docker buildx imagetools inspect "$final" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.runtime }}
          path: manifest.json
