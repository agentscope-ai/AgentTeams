name: Build Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. v1.1.0). Leave empty for tag-triggered runs.'
        required: false
        type: string
      targets:
        description: 'Space-separated list of push targets (default: all). Options: openclaw-base agentteams-controller embedded manager manager-qwenpaw worker copaw-worker hermes-worker qwenpaw-worker'
        required: false
        type: string
        default: 'all'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - name: Resolve build targets and dependencies
        id: meta
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TARGETS: ${{ inputs.targets }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re

          dependencies = {
              'openclaw-base': [],
              'agentteams-controller': [],
              'embedded': ['agentteams-controller'],
              'manager': ['openclaw-base', 'agentteams-controller'],
              'manager-qwenpaw': ['agentteams-controller'],
              'worker': ['openclaw-base', 'agentteams-controller'],
              'copaw-worker': ['agentteams-controller'],
              'hermes-worker': ['agentteams-controller'],
              'qwenpaw-worker': [],
          }
          tagged = os.environ['GITHUB_REF'].startswith('refs/tags/')
          version = os.environ['GITHUB_REF_NAME'] if tagged else os.environ['REQUESTED_VERSION'] or 'latest'
          if not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}', version):
              raise SystemExit('Invalid image version')
          requested = 'all' if tagged else os.environ['REQUESTED_TARGETS'] or 'all'
          selected = set(dependencies) if requested == 'all' else set(requested.split())
          if not selected or selected - dependencies.keys():
              raise SystemExit('Unknown or empty build targets: ' + requested)
          for target in list(selected):
              selected.update(dependencies[target])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('version=' + version, file=output)
              print('targets=' + json.dumps(sorted(selected)), file=output)
          PYTHON

  openclaw-base:
    needs: [prepare]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'openclaw-base')
    uses: ./.github/workflows/build-image.yml
    with:
      target: openclaw-base
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  agentteams-controller:
    needs: [prepare]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'agentteams-controller')
    uses: ./.github/workflows/build-image.yml
    with:
      target: agentteams-controller
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  embedded:
    needs: [prepare, agentteams-controller]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'embedded')
    uses: ./.github/workflows/build-image.yml
    with:
      target: embedded
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  manager:
    needs: [prepare, openclaw-base, agentteams-controller]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'manager')
    uses: ./.github/workflows/build-image.yml
    with:
      target: manager
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  manager-qwenpaw:
    needs: [prepare, agentteams-controller]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'manager-qwenpaw')
    uses: ./.github/workflows/build-image.yml
    with:
      target: manager-qwenpaw
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  worker:
    needs: [prepare, openclaw-base, agentteams-controller]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'worker')
    uses: ./.github/workflows/build-image.yml
    with:
      target: worker
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  copaw-worker:
    needs: [prepare, agentteams-controller]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'copaw-worker')
    uses: ./.github/workflows/build-image.yml
    with:
      target: copaw-worker
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  hermes-worker:
    needs: [prepare, agentteams-controller]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'hermes-worker')
    uses: ./.github/workflows/build-image.yml
    with:
      target: hermes-worker
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  qwenpaw-worker:
    needs: [prepare]
    if: contains(fromJSON(needs.prepare.outputs.targets), 'qwenpaw-worker')
    uses: ./.github/workflows/build-image.yml
    with:
      target: qwenpaw-worker
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  release:
    needs: [prepare, openclaw-base, agentteams-controller, embedded, manager, manager-qwenpaw, worker, copaw-worker, hermes-worker, qwenpaw-worker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit
