name: Verify corrected Team notification E2E
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact test-only repair source
        default: a99adf840c61d261ec7ae2aa579f3a0c7e690f10
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
jobs:
  team26:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          submodules: recursive
      - name: Prove reused image source equivalence
        env:
          SOURCE: ${{ inputs.source }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          source = os.environ["SOURCE"]
          base = "119d521167db4d54a1a0bfed7d22de0158673388"
          assert source == "a99adf840c61d261ec7ae2aa579f3a0c7e690f10"
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, source], text=True).splitlines())
          assert changed == {"tests/test-26-qwenpaw-teamharness-plugin-mode.sh", "tests/test_teamharness_notification_wait.py"}, changed
          run = json.loads(subprocess.check_output(["gh", "api", "repos/agentscope-ai/AgentTeams/actions/runs/44592648361"], text=True))
          assert run["head_sha"] == base
          artifacts = json.loads(subprocess.check_output(["gh", "api", "repos/agentscope-ai/AgentTeams/actions/runs/44592648361/artifacts?per_page=100"], text=True))["artifacts"]
          required = {"image-controller", "image-embedded", "image-manager-qwenpaw", "image-qwenpaw-worker"}
          assert required <= {a["name"] for a in artifacts if not a["expired"]}
          assert all(a["workflow_run"]["head_sha"] == base for a in artifacts)
          print("Runtime/build/submodule inputs unchanged; only Team E2E assertions changed")
          PY
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify corrected notification fixtures
        run: |
          python -m pip install pytest
          python -m pytest tests/test_teamharness_notification_wait.py tests/test_task_coordination.py -q
          bash -n tests/test-26-qwenpaw-teamharness-plugin-mode.sh
      - uses: docker/login-action@v3
        with:
          registry: higress-registry.cn-hangzhou.cr.aliyuncs.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Download previously built identical runtime images
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44592648361
          pattern: image-!(openclaw-base)
          path: /tmp/images
      - name: Verify and load original image archives
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(/tmp/images/image-*/*.tar.gz)
          test "${#archives[@]}" -ge 4
          for file in "${archives[@]}"; do
            gzip -t "$file"
            gunzip -c "$file" | docker load
          done
      - name: Install integration dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl unzip
      - name: Run corrected Team E2E from the exact source
        env:
          AGENTTEAMS_LLM_API_KEY: ${{ secrets.AGENTTEAMS_LLM_API_KEY }}
          AGENTTEAMS_LLM_PROVIDER: qwen
          AGENTTEAMS_DEFAULT_MODEL: qwen3.6-plus
          AGENTTEAMS_MANAGER_RUNTIME: qwenpaw
          AGENTTEAMS_INSTALL_MANAGER_QWENPAW_IMAGE: agentteams/manager-qwenpaw:latest
          AGENTTEAMS_DEFAULT_WORKER_RUNTIME: qwenpaw
        run: |
          AGENTTEAMS_VERSION=v1.2.0-beta.1 SKIP_BUILD=1 make test-embedded LOCAL_COPAW_WORKER=higress-registry.cn-hangzhou.cr.aliyuncs.com/agentteams/agentteams-copaw-worker:v1.2.4 TEST_FILTER=26
      - name: Export failure evidence
        if: always()
        continue-on-error: true
        run: python3 scripts/export-debug-log.py --range 2h --no-redact
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team26-a99adf84-repair
          path: |
            tests/output/
            debug-log/
          retention-days: 7
