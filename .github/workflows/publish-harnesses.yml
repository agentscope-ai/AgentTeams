name: Refresh release Helm CDN files
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refresh the two updated Helm objects
        env:
          RELEASE_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEYID }}
          RELEASE_ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEYSECRET }}
        run: |
          python3 - <<'PY'
          import base64, datetime, hashlib, hmac, json, os, sys, urllib.error, urllib.parse, urllib.request, uuid
          q = lambda value: urllib.parse.quote(str(value), safe="~")
          params = {
              "Action": "RefreshObjectCaches", "Version": "2018-05-10", "Format": "JSON",
              "AccessKeyId": os.environ["RELEASE_ACCESS_KEY_ID"],
              "SignatureMethod": "HMAC-SHA1", "SignatureVersion": "1.0",
              "Timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "SignatureNonce": uuid.uuid4().hex, "ObjectType": "File",
              "ObjectPath": "https://higress.cn/helm-charts/index.yaml\nhttps://higress.cn/helm-charts/agentteams-1.2.8.tgz",
          }
          assert params["AccessKeyId"] and os.environ["RELEASE_ACCESS_KEY_SECRET"]
          canonical = "&".join(q(k) + "=" + q(params[k]) for k in sorted(params))
          signature = hmac.new((os.environ["RELEASE_ACCESS_KEY_SECRET"] + "&").encode(),
              ("POST&%2F&" + q(canonical)).encode(), hashlib.sha1).digest()
          params["Signature"] = base64.b64encode(signature).decode()
          request = urllib.request.Request("https://cdn.aliyuncs.com/",
              data=urllib.parse.urlencode(params).encode(), method="POST",
              headers={"Content-Type": "application/x-www-form-urlencoded"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              result = json.loads(error.read())
              print(json.dumps({"httpStatus": error.code, "code": result.get("Code"), "requestId": result.get("RequestId")}))
              sys.exit(1)
          except Exception as error:
              print(type(error).__name__)
              sys.exit(1)
          assert result.get("RefreshTaskId"), "No refresh task ID returned"
          print(json.dumps({"taskId": result["RefreshTaskId"], "requestId": result.get("RequestId")}))
          PY
