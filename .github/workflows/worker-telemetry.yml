name: Worker telemetry

on:
  pull_request:
    paths:
      - 'shared/lib/telemetry/**'
      - 'tests/test_worker_telemetry.py'
      - 'tests/test_worker_full_telemetry.py'
      - '.github/workflows/worker-telemetry.yml'
  push:
    branches: [main]
    paths:
      - 'shared/lib/telemetry/**'
      - 'tests/test_worker_telemetry.py'
      - 'tests/test_worker_full_telemetry.py'
      - '.github/workflows/worker-telemetry.yml'

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shared/lib/telemetry/requirements.txt
      - run: python -m pip install -r shared/lib/telemetry/requirements.txt openai==3.46.0 pytest
      - run: python -m pytest tests/test_worker_telemetry.py tests/test_worker_full_telemetry.py -q
