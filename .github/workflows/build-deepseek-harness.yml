name: Build DeepSeek Harness Runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Independent DeepSeek Harness runtime version (e.g. v0.1.0)'
        required: true
        type: string
        default: 'v0.1.0'
  push:
    branches:
      - main
    tags:
      - 'deepseek-harness-v[0-9]+.[0-9]+.[0-9]+'
      - 'deepseek-harness-v[0-9]+.[0-9]+.[0-9]+-*'
    paths:
      - 'deepseek-harness/**'
      - 'plugins/teamharness/**'
      - 'shared/lib/**'
      - 'Makefile'
      - '.github/workflows/build-deepseek-harness.yml'

env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
  REPO: agentteams

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free Up GitHub Actions Ubuntu Runner Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve runtime version
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          elif [[ "${GIT_REF}" == refs/tags/deepseek-harness-* ]]; then
            VERSION="${REF_NAME}"
            VERSION="${VERSION#deepseek-harness-}"
          else
            VERSION="sha-${COMMIT_SHA:0:12}"
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [[ "${GIT_REF}" == refs/tags/deepseek-harness-* ]]; then
            if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "ERROR: invalid runtime version: ${VERSION}"
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push runtime image
        env:
          RUNTIME_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          make push-deepseek-harness-worker \
            DEEPSEEK_HARNESS_WORKER_VERSION="${RUNTIME_VERSION}" \
            REGISTRY="${REGISTRY}" \
            REPO="${REPO}" \
            DOCKER_BUILD_ARGS="--build-arg APT_MIRROR= --build-arg PIP_INDEX_URL=https://pypi.org/simple/"

      - name: Verify published image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          IMAGE="${REGISTRY}/${REPO}/agentteams-deepseek-harness-worker:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}"
          MANIFEST="$(docker buildx imagetools inspect --raw "${IMAGE}")"
          for PLATFORM in linux/amd64 linux/arm64; do
            if ! jq -e --arg platform "${PLATFORM}" \
              'any(.manifests[]?; ((.platform.os // "") + "/" + (.platform.architecture // "")) == $platform)' \
              <<<"${MANIFEST}" >/dev/null; then
              echo "ERROR: ${IMAGE} is missing ${PLATFORM}"
              exit 1
            fi
          done
          {
            echo "### DeepSeek Harness Runtime"
            echo ""
            echo "- Image: \`${IMAGE}\`"
            echo "- Platforms: \`linux/amd64, linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
