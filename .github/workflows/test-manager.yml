name: AgentTeams Manager Tests

on:
  pull_request:
    paths:
      - 'worker'
      - 'worker/**'
      - '.gitmodules'
      - 'manager/src/**'
      - 'manager/Dockerfile.qwenpaw'
      - 'manager/scripts/init/start-qwenpaw-manager.sh'
      - 'plugins/agentteams-manager-tools/**'
      - 'manager/agent/skills/coding-cli-management/**'
      - 'manager/tests/test-coding-cli-skill-flow.sh'
      - 'manager/tests/test-openclaw-config-migration.sh'
      - 'manager/agent/skills/model-switch/**'
      - 'manager/tests/test_update_manager_model.py'
      - 'manager/configs/**'
      - 'shared/lib/migrate-openclaw-config.sh'
      - 'tests/lib/test-helpers.sh'
      - 'tests/test-manager-harness-helpers.sh'
      - '.github/workflows/test-manager.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-manager.yml'
      - 'worker'
      - 'worker/**'
      - '.gitmodules'
      - 'manager/src/**'
      - 'manager/Dockerfile.qwenpaw'
      - 'manager/scripts/init/start-qwenpaw-manager.sh'
      - 'plugins/agentteams-manager-tools/**'
      - 'manager/agent/skills/coding-cli-management/**'
      - 'manager/tests/test-coding-cli-skill-flow.sh'
      - 'manager/tests/test-openclaw-config-migration.sh'
      - 'manager/agent/skills/model-switch/**'
      - 'manager/tests/test_update_manager_model.py'
      - 'manager/configs/**'
      - 'shared/lib/migrate-openclaw-config.sh'
      - 'tests/lib/test-helpers.sh'
      - 'tests/test-manager-harness-helpers.sh'
  workflow_dispatch:

jobs:
  manager-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused Python test dependencies
        # Pinned to the QwenPaw 2.2.x production venv (qwenpaw==2.2.x
        # requires agentscope==2.0.9; the manager image runs on the same
        # venv via Dockerfile.qwenpaw) so unit tests match runtime behavior.
        run: |
          python -m pip install \
            'agentscope==2.0.9' \
            'matrix-nio==0.26.0' \
            'PyYAML>=6.0,<7' \
            'markdown-it-py>=3.0' \
            'linkify-it-py>=2.0' \
            'pytest>=8.3,<10' \
            'pytest-asyncio>=0.23,<2'

      - name: Check shared Harness readiness and Manager ACL helpers
        run: bash tests/test-manager-harness-helpers.sh

      - name: Guard the coding-cli first-use flow
        run: bash manager/tests/test-coding-cli-skill-flow.sh

      - name: Guard the persisted openclaw.json migration (shell/Python parity)
        run: bash manager/tests/test-openclaw-config-migration.sh

      - name: Guard runtime-specific model switch instructions
        run: python -m unittest discover -s manager/tests -p 'test_update_manager_model.py' -v

      - name: Run agentteams_manager unit tests
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}/manager/src/agentteams_manager" \
            python -m pytest manager/src/agentteams_manager/agentteams_manager/tests/ -q

      - name: Verify Manager package has zero copaw imports
        run: |
          if grep -rn "import copaw\|from copaw" manager/src/agentteams_manager/agentteams_manager/; then
            echo "FAIL: agentteams_manager must not import copaw"
            exit 1
          fi
          echo "OK: no copaw imports in agentteams_manager"
