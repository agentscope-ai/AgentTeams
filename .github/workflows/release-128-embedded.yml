name: Stage 1.2.8 embedded on native runners
on:
  workflow_dispatch:
    inputs:
      controller:
        description: Verified immutable dual-architecture Controller reference
        required: true
        type: string
permissions:
  contents: read
env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
jobs:
  stage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and smoke exact native embedded artifact
        env:
          ARCH: ${{ matrix.arch }}
          CONTROLLER: ${{ inputs.controller }}
        run: |
          [[ "$CONTROLLER" =~ ^higress-registry.cn-hangzhou.cr.aliyuncs.com/agentteams/agentteams-controller@sha256:[a-f0-9]{64}$ ]]
          image="${REGISTRY}/agentteams/agentteams-embedded:stage-v1.2.8-${GITHUB_SHA:0:12}-${ARCH}"
          make -o build-agentteams-controller build-embedded \
            VERSION=v1.2.8 LOCAL_EMBEDDED="$image" \
            LOCAL_CONTROLLER_BUILD_IMAGE="$CONTROLLER" DOCKER_PLATFORM="linux/$ARCH" \
            HIGRESS_REGISTRY=higress-registry.us-west-1.cr.aliyuncs.com \
            DOCKER_BUILD_ARGS="--network=host --label org.opencontainers.image.revision=${GITHUB_SHA} --label org.opencontainers.image.version=v1.2.8"
          docker run --rm --platform "linux/$ARCH" --entrypoint bash "$image" -ec '
            command -v agt
            agt tracing --help >/dev/null
            command -v agentteams-controller
            command -v tuwunel
            command -v minio
            test -d /opt/agentteams/config/crd
            test -f /etc/supervisor/conf.d/supervisord.conf
          '
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          docker pull --platform "linux/$ARCH" "${image%:*}@${digest}"
          docker run --rm --platform "linux/$ARCH" --entrypoint agt "${image%:*}@${digest}" tracing --help
          echo "${image%:*}@${digest}" >> "$GITHUB_STEP_SUMMARY"
