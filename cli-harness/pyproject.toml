[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentteams-cli-harness"
version = "0.1.0"
description = "AgentTeams CLI-harness worker: bridges Matrix rooms to headless CLI coding agents"
requires-python = ">=3.11"
dependencies = [
    "matrix-nio[e2e]>=0.24.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.scripts]
cli-harness-worker = "cli_harness_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
