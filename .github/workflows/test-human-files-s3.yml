name: test-human-files-s3

on:
  pull_request:
    paths:
      - "agentteams-controller/**"
      - ".github/workflows/test-human-files-s3.yml"
  workflow_dispatch:

jobs:
  lifecycle:
    name: human files lifecycle (RustFS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agentteams-controller/go.mod
          cache-dependency-path: agentteams-controller/go.sum

      # The controller shells out to mc for object reads, stats and copies, so
      # the regression must exercise the same client. The MinIO project has
      # archived its downloads page; the release asset is still published.
      - name: Install mc
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 hack/install-mc.py "$RUNNER_TEMP/mc"
          sudo install -m 755 "$RUNNER_TEMP/mc" /usr/local/bin/mc
          mc --version

      # RustFS is the 1.2.6 default backend, so the native regression runs
      # against it rather than MinIO.
      - name: Start RustFS 1.0.4
        run: |
          # The image runs as a non-root user, so a runner-owned bind directory is
          # not writable for it (fatal: "Io error: Permission denied (os error 13)"
          # while initializing /data and /logs). Make the mount points writable
          # explicitly instead of relying on the image's directory ownership.
          mkdir -p .rustfs-data .rustfs-logs
          chmod 777 .rustfs-data .rustfs-logs
          docker run -d --name rustfs \
            -p 9000:9000 -p 9001:9001 \
            -e RUSTFS_ACCESS_KEY=minioadmin \
            -e RUSTFS_SECRET_KEY=minioadmin \
            -e RUSTFS_VOLUMES=/data \
            -v "$PWD/.rustfs-data:/data" \
            -v "$PWD/.rustfs-logs:/logs" \
            rustfs/rustfs:1.0.4
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs rustfs || true
          exit 1

      - name: Create bucket
        run: |
          # /minio/health/live answers before RustFS can serve requests: observed
          # readiness phases include "waiting for startup_finalization" and
          # "waiting for iam". Chasing phases means the job breaks again on the
          # next one, so retry the operations the job actually needs instead --
          # alias set is idempotent and bucket creation is --ignore-existing.
          deadline=$((SECONDS + 180))
          until mc alias set s3 http://127.0.0.1:9000 minioadmin minioadmin \
                && mc mb --ignore-existing s3/human-files-test; do
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "RustFS did not serve the setup calls within 180s" >&2
              docker logs rustfs || true
              exit 1
            fi
            sleep 2
          done

      # Both the normal handler lifecycle and the provider fallback (conditional
      # PUT answered with 501) run against the same backend, because the
      # fallback is a separate write path that can silently lose the marker.
      - name: Lifecycle regression
        working-directory: agentteams-controller
        env:
          HUMAN_FILES_S3_ENDPOINT: http://127.0.0.1:9000
          # The presign anonymous-download regression signs against a
          # caller-reachable origin. RustFS is the only storage here, so the
          # public endpoint is the same instance reached through a different
          # hostname (localhost vs 127.0.0.1) — both resolvable from the test
          # process, but the public host is distinct from the internal one, so
          # the contract stays fully exercised: anonymous 200 with correct
          # bytes/ETag, unsigned 403, TTL expiry 200->403, and the
          # host-in-signature reverse proof (signing for localhost must not
          # yield a working 127.0.0.1 request).
          HUMAN_FILES_S3_PUBLIC_ENDPOINT: http://localhost:9000
          HUMAN_FILES_S3_ACCESS_KEY: minioadmin
          HUMAN_FILES_S3_SECRET_KEY: minioadmin
          HUMAN_FILES_S3_BUCKET: human-files-test
        run: |
          # TestHumanFiles_S3 matches all S3-gated regressions in the server
          # package: the lifecycle, the trash restore/purge quota races, and
          # the presign anonymous-download / capability-boundary pair.
          go test ./internal/server -run 'TestHumanFiles_S3' -count=1 -v
          go test ./internal/oss -run TestS3FallbackLifecycle -count=1 -v

  # The sync protocol regression (#1414 P3): independent HTTP clients with
  # real bearer tokens over the sync endpoints, against the same kind of
  # backend production runs. It gets its own RustFS + bucket so it can run
  # in parallel with the lifecycle job.
  sync-protocol:
    name: sync protocol (RustFS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agentteams-controller/go.mod
          cache-dependency-path: agentteams-controller/go.sum

      - name: Install mc
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 hack/install-mc.py "$RUNNER_TEMP/mc"
          sudo install -m 755 "$RUNNER_TEMP/mc" /usr/local/bin/mc
          mc --version

      - name: Start RustFS 1.0.4
        run: |
          # Same rationale as the lifecycle job: the image runs as a
          # non-root user, so the bind directories must be runner-writable.
          mkdir -p .rustfs-data .rustfs-logs
          chmod 777 .rustfs-data .rustfs-logs
          docker run -d --name rustfs \
            -p 9000:9000 -p 9001:9001 \
            -e RUSTFS_ACCESS_KEY=minioadmin \
            -e RUSTFS_SECRET_KEY=minioadmin \
            -e RUSTFS_VOLUMES=/data \
            -v "$PWD/.rustfs-data:/data" \
            -v "$PWD/.rustfs-logs:/logs" \
            rustfs/rustfs:1.0.4
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs rustfs || true
          exit 1

      - name: Create bucket
        run: |
          # A healthy HTTP endpoint does not mean RustFS can serve S3 setup
          # calls yet. Use the same bounded, idempotent readiness check as the
          # lifecycle job before starting the sync protocol regression.
          deadline=$((SECONDS + 180))
          until mc alias set s3 http://127.0.0.1:9000 minioadmin minioadmin \
                && mc mb --ignore-existing s3/human-sync-protocol-test; do
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "RustFS did not serve the setup calls within 180s" >&2
              docker logs rustfs || true
              exit 1
            fi
            sleep 2
          done

      - name: Sync protocol regression
        working-directory: agentteams-controller
        env:
          AGENTTEAMS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AGENTTEAMS_TEST_S3_ACCESS_KEY: minioadmin
          AGENTTEAMS_TEST_S3_SECRET_KEY: minioadmin
          AGENTTEAMS_TEST_S3_BUCKET: human-sync-protocol-test
        run: |
          go test ./internal/server -run 'TestHumanFileSyncProtocol' -count=1 -v
