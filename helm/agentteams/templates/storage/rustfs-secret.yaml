{{- if and (eq .Values.storage.provider "s3") (eq .Values.storage.engine "rustfs") (not .Values.storage.rustfs.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentteams.rustfs.fullname" . }}
  namespace: {{ include "agentteams.namespace" . }}
  labels:
    {{- include "agentteams.component.labels" (dict "root" . "component" "rustfs") | nindent 4 }}
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: {{ .Values.storage.rustfs.auth.rootUser | quote }}
  RUSTFS_SECRET_KEY: {{ .Values.storage.rustfs.auth.rootPassword | quote }}
{{- end }}
