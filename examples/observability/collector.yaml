receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  transform/native-kinds:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - set(attributes["langfuse.observation.type"], "generation") where attributes["langfuse.observation.type"] == nil and attributes["gen_ai.operation.name"] == "chat"
          - set(attributes["langfuse.observation.type"], "tool") where attributes["langfuse.observation.type"] == nil and attributes["gen_ai.operation.name"] == "execute_tool"
          - set(attributes["langfuse.observation.type"], "agent") where attributes["langfuse.observation.type"] == nil and attributes["gen_ai.operation.name"] == "invoke_agent"
          - set(attributes["langfuse.observation.type"], "span") where attributes["langfuse.observation.type"] == nil
  batch:
    timeout: 1s
    send_batch_size: 256
extensions:
  file_storage:
    directory: /var/lib/otelcol
exporters:
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_BASE_URL}
    headers:
      Authorization: Basic ${env:LANGFUSE_BASIC_AUTH}
      x-langfuse-ingestion-version: "4"
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
service:
  extensions: [file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/native-kinds, batch]
      exporters: [otlphttp/langfuse]
