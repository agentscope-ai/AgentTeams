name: Build Base Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'openclaw-base/**'
      # A pin bump changes the derived tag without touching openclaw-base/**;
      # the published tag must follow the pin, or consumers wait forever.
      - 'hack/versions.env'

env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
  REPO: agentteams

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free Up GitHub Actions Ubuntu Runner Disk Space 🔧
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve the derived base tag
        id: base
        run: echo "tag=$(sed -n 's/^OPENCLAW_BASE_TAG=//p' hack/versions.env)" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch base image
        run: |
          make push-openclaw-base \
            VERSION=${{ steps.base.outputs.tag }} \
            PUSH_LATEST=1 \
            REGISTRY=${{ env.REGISTRY }} \
            REPO=${{ env.REPO }} \
            HIGRESS_REGISTRY=higress-registry.us-west-1.cr.aliyuncs.com

      - name: Summary
        run: |
          echo "### Base Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- OpenClaw Base (immutable): \`${{ env.REGISTRY }}/${{ env.REPO }}/openclaw-base:${{ steps.base.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- OpenClaw Base (rolling): \`${{ env.REGISTRY }}/${{ env.REPO }}/openclaw-base:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Platforms: \`linux/amd64, linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
