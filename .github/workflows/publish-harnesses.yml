name: Recover native AMD64 artifacts through verified transport
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
  SOURCE: a5ddf6ae0f6d14797bf14924de12452ab69c3f2a
jobs:
  transport:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - artifact: controller
            image: agentteams-controller
          - artifact: openclaw-base
            image: openclaw-base
          - artifact: embedded
            image: agentteams-embedded
          - artifact: worker
            image: agentteams-harness-openclaw
          - artifact: qwenpaw-worker
            image: agentteams-harness-qwenpaw
          - artifact: hermes-worker
            image: agentteams-harness-hermes
          - artifact: deepseek-harness-worker
            image: agentteams-harness-deepseek
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44551299004
          name: image-${{ matrix.artifact }}
          path: /tmp/input
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Load and label already native-built AMD64 bytes
        env:
          IMAGE: ${{ matrix.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api repos/agentscope-ai/AgentTeams/actions/runs/44551299004 --jq .head_sha)" = "$SOURCE"
          gzip -dc /tmp/input/*.tar.gz | docker load
          input="agentteams/$IMAGE:latest"
          test "$(docker image inspect "$input" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          image="$REGISTRY/agentteams/$IMAGE:transport-v1.2.8-a5ddf6ae-amd64"
          docker build --platform linux/amd64 --build-arg "INPUT_IMAGE=$input" \
            --label "org.opencontainers.image.revision=$SOURCE" --label org.opencontainers.image.version=v1.2.8 \
            --label "io.agentteams.packaging-revision=$GITHUB_SHA" \
            -f scripts/release/128-metadata.Dockerfile -t "$image" .
      - name: Push without executing foreign architecture code
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          image="$REGISTRY/agentteams/$IMAGE:transport-v1.2.8-a5ddf6ae-amd64"
          timeout 600 docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          echo "$IMAGE ${image%:*}@$digest" >> "$GITHUB_STEP_SUMMARY"
  verify:
    needs: transport
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [agentteams-controller, openclaw-base, agentteams-embedded, agentteams-harness-openclaw, agentteams-harness-qwenpaw, agentteams-harness-hermes, agentteams-harness-deepseek]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Pull immutable bytes and verify on native AMD64
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          image="$REGISTRY/agentteams/$IMAGE:transport-v1.2.8-a5ddf6ae-amd64"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          ref="${image%:*}@$digest"
          timeout 600 docker pull --platform linux/amd64 "$ref"
          test "$(docker image inspect "$ref" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          if [[ "$IMAGE" == openclaw-base ]]; then
            docker run --rm --entrypoint bash "$ref" -ec 'node --version; openclaw --version; grep -rFl "com.agentteams.read_audience" /opt/openclaw/dist/extensions/matrix >/dev/null'
          else
            docker run --rm --entrypoint agt "$ref" tracing --help
          fi
          case "$IMAGE" in
            agentteams-harness-openclaw) docker run --rm --entrypoint bash -v "$PWD/worker/tests/image-smoke.sh:/tmp/smoke.sh:ro" "$ref" /tmp/smoke.sh ;;
            agentteams-harness-qwenpaw) docker run --rm --entrypoint /opt/venv/qwenpaw/bin/python "$ref" -c 'import qwenpaw_worker' ;;
            agentteams-harness-hermes) docker run --rm --entrypoint /opt/venv/hermes/bin/python "$ref" -c 'import hermes_worker' ;;
            agentteams-harness-deepseek) docker run --rm --entrypoint python3 -v "$PWD/deepseek-harness/tests/headless_smoke.py:/tmp/smoke.py:ro" "$ref" /tmp/smoke.py ;;
          esac
          echo "$IMAGE $ref native AMD64 passed" >> "$GITHUB_STEP_SUMMARY"
