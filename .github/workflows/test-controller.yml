          import nio  # noqa: F401  the suite skips without matrix-nio
          print("matrix-nio", md.version("matrix-nio"))
          print("qwenpaw", md.version("qwenpaw"))
          PY

      - name: Run matrix-channel send-gate retrigger relevance tests
        run: |
          python -m pytest plugins/tests/agentteams-matrix-channel/test_send_gate_retrigger_relevance.py -q -rs

  matrix-channel-retry-classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install matrix-channel runtime dependencies
        run: |
