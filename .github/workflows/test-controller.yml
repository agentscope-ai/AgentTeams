name: AgentTeams Controller Tests

on:
  pull_request:
    paths:
      - 'agentteams-controller/**'
      - 'manager/src/**'
      - 'plugins/teamharness/**'
      - 'plugins/agentteams-matrix-channel/**'
      - 'plugins/agentteams-matrix/**'
      - 'plugins/agentteams-teamharness/**'
      - 'plugins/tests/**'
      - 'plugins/scripts/**'
      - 'plugins/*/plugin.yaml'
      - '.github/workflows/build-plugin.yml'
      - 'docs/design/teamharness/**'
      - '.github/workflows/test-controller.yml'
  push:
    branches: [main]
    paths:
      - 'agentteams-controller/**'
      - 'manager/src/**'
      - 'plugins/teamharness/**'
      - 'plugins/agentteams-matrix-channel/**'
      - 'plugins/agentteams-matrix/**'
      - 'plugins/agentteams-teamharness/**'
      - 'plugins/tests/**'
      - 'plugins/scripts/**'
      - 'plugins/*/plugin.yaml'
      - '.github/workflows/build-plugin.yml'
      - 'docs/design/teamharness/**'
      - '.github/workflows/test-controller.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agentteams-controller/go.mod
          cache-dependency-path: agentteams-controller/go.sum

      - name: Unit tests
        working-directory: agentteams-controller
        run: make test-unit

      - name: Integration tests (envtest)
        working-directory: agentteams-controller
        run: make test-integration

  teamharness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install focused Python test dependencies
        run: |
          python -m pip install \
            'agentscope==2.0.4.post1' \
            'PyYAML>=6.0,<7' \
            'matrix-nio>=0.25,<0.27' \
            'pytest>=8.3,<10' \
            'pytest-asyncio>=0.23,<2'

      - name: Run durable continuation contract tests
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: |
          ruby plugins/tests/teamharness/test-contracts.rb
          python -m pytest plugins/tests/teamharness/mcp/test_continuation.py -q
          python -m pytest plugins/tests/teamharness/mcp/test_delegate_redelegation.py -q
          python -m pytest plugins/tests/teamharness/mcp/test_filesync_remote_guard.py -q
          python -m pytest plugins/tests/teamharness/mcp/test_sensitive_scan_placeholder.py -q
          python -m pytest plugins/tests/teamharness/test_loop_budget.py -q
          python -m pytest plugins/tests/teamharness/test_pull_project.py -q
          python -m pytest plugins/tests/teamharness/test_signal_emission.py -q
          python -m pytest plugins/tests/teamharness/test_transition_validation.py -q
          python -m pytest plugins/tests/teamharness/test_attention_schema.py -q
          PYTHONPATH="${GITHUB_WORKSPACE}/manager/src/agentteams_manager" \
            python -m pytest manager/src/agentteams_manager/agentteams_manager/tests/ -q
          ruby plugins/tests/teamharness/mcp/tools/test-taskflow.rb
          ruby plugins/tests/teamharness/mcp/tools/test-transition-table.rb

  matrix-channel-completion-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install matrix-channel runtime dependencies
        run: |
          python -m pip install \
            'matrix-nio>=0.25,<0.27' \
            'qwenpaw>=2.2.1,<2.3' \
            'pytest>=8.3,<10' \
            'pytest-asyncio>=0.23,<2'

      - name: Run matrix-channel completion-guard tests
        run: |
          python -m pytest plugins/tests/agentteams-matrix-channel/test_fake_completion_marker.py -q

  matrix-channel-consume-error:
