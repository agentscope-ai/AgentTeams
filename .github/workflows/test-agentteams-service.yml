name: Test agentteams-service

# R1 service module CI: independent Go module, independent gates.
# The repository-wide workflows are untouched (the service is additive).
on:
  pull_request:
    paths:
      - 'agentteams-service/**'
      - '.github/workflows/test-agentteams-service.yml'
  push:
    branches: [main]
    paths:
      - 'agentteams-service/**'
      - '.github/workflows/test-agentteams-service.yml'

permissions:
  contents: read

concurrency:
  group: test-agentteams-service-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: agentteams-service

jobs:
  unit:
    name: fmt / vet / build / test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agentteams-service/go.mod
          cache-dependency-path: agentteams-service/go.sum
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "not gofmt-clean:"; echo "$files"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...

  integration:
    name: MySQL 8 dialect conformance (test harness)
    needs: unit
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: at_svc_root
          MYSQL_DATABASE: res
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pat_svc_root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agentteams-service/go.mod
          cache-dependency-path: agentteams-service/go.sum
      - name: create ops schema
        run: mysql --protocol=TCP -h127.0.0.1 -uroot -pat_svc_root -e 'CREATE DATABASE IF NOT EXISTS ops'
      - name: integration tests
        env:
          AGENTTEAMS_TEST_RES_DSN: 'root:at_svc_root@tcp(127.0.0.1:3306)/res?parseTime=true&loc=UTC'
          AGENTTEAMS_TEST_OPS_DSN: 'root:at_svc_root@tcp(127.0.0.1:3306)/ops?parseTime=true&loc=UTC'
        run: go test -tags integration -count=1 ./test/integration/...

  e2e:
    name: MySQL 8 dialect e2e (test harness)
    needs: unit
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: at_svc_root
          MYSQL_DATABASE: res
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pat_svc_root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agentteams-service/go.mod
          cache-dependency-path: agentteams-service/go.sum
      - name: create ops schema
        run: mysql --protocol=TCP -h127.0.0.1 -uroot -pat_svc_root -e 'CREATE DATABASE IF NOT EXISTS ops'
      - name: e2e (boot, auth, create/list, SIGTERM)
        env:
          AGENTTEAMS_TEST_RES_DSN: 'root:at_svc_root@tcp(127.0.0.1:3306)/res?parseTime=true&loc=UTC'
          AGENTTEAMS_TEST_OPS_DSN: 'root:at_svc_root@tcp(127.0.0.1:3306)/ops?parseTime=true&loc=UTC'
        run: go test -tags e2e -count=1 ./test/e2e/...

  seekdb:
    name: seekdb product backend (integration + e2e)
    needs: unit
    runs-on: ubuntu-latest
    services:
      seekdb:
        image: oceanbase/seekdb:1.4.0-100000172026082615
        env:
          SEEKDB_DATABASE: res
        ports:
          - 2881:2881
        options: >-
          --health-cmd="mysqladmin --protocol=tcp -h127.0.0.1 -P2881 -uroot ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agentteams-service/go.mod
          cache-dependency-path: agentteams-service/go.sum
      - name: install mysql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
      - name: create schemas
        run: |
          mysql --protocol=TCP -h127.0.0.1 -P2881 -uroot -e 'CREATE DATABASE IF NOT EXISTS res; CREATE DATABASE IF NOT EXISTS ops; CREATE DATABASE IF NOT EXISTS work; CREATE DATABASE IF NOT EXISTS mem;'
      - name: integration tests (seekdb)
        env:
          AGENTTEAMS_TEST_RES_DSN: 'root:@tcp(127.0.0.1:2881)/res?parseTime=true&loc=UTC'
          AGENTTEAMS_TEST_OPS_DSN: 'root:@tcp(127.0.0.1:2881)/ops?parseTime=true&loc=UTC'
        run: go test -tags integration -count=1 ./test/integration/...
      - name: e2e (seekdb)
        env:
          AGENTTEAMS_TEST_RES_DSN: 'root:@tcp(127.0.0.1:2881)/res?parseTime=true&loc=UTC'
          AGENTTEAMS_TEST_OPS_DSN: 'root:@tcp(127.0.0.1:2881)/ops?parseTime=true&loc=UTC'
        run: go test -tags e2e -count=1 ./test/e2e/...

  image:
    name: container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: agentteams-service
          push: false
          tags: agentteams-service:ci
