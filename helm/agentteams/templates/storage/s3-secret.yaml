{{- if and (eq .Values.storage.provider "s3") (eq .Values.storage.mode "existing") (not .Values.storage.s3.existingSecret) }}
# Rendered from inline dev credentials (storage.s3.accessKey/secretKey).
# Production deployments should set storage.s3.existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentteams.storage.s3.secretName" . }}
  namespace: {{ include "agentteams.namespace" . }}
  labels:
    {{- include "agentteams.component.labels" (dict "root" . "component" "storage-s3") | nindent 4 }}
type: Opaque
stringData:
  {{ include "agentteams.storage.s3.accessKeyKey" . }}: {{ .Values.storage.s3.accessKey | quote }}
  {{ include "agentteams.storage.s3.secretKeyKey" . }}: {{ .Values.storage.s3.secretKey | quote }}
{{- end }}
