name: Build RC

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'RC version tag (e.g. v1.0.5-rc.1)'
        required: true
        type: string
      targets:
        description: 'Core-context targets (default: controller, embedded, QwenPaw, Hermes, OpenHuman, DeepSeek). Codex/Claude use publish-harnesses; OpenClaw is explicit only'
        required: false
        type: string
        default: 'all'

env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
  REPO: agentteams

jobs:
  build-rc:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free Up GitHub Actions Ubuntu Runner Disk Space 🔧
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate RC version
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "${VERSION}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "ERROR: version must be an RC format, e.g. v1.0.5-rc.1 (got: ${VERSION})"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push multi-arch images
        env:
          REQUESTED_TARGETS: ${{ inputs.targets }}
          VERSION: ${{ inputs.version }}
        run: |
          requested="${REQUESTED_TARGETS:-all}"
          if [[ "$requested" == all ]]; then
            requested="agentteams-controller embedded qwenpaw-worker hermes-worker openhuman-worker deepseek-harness-worker"
          fi
          read -r -a targets <<< "$requested"
          [[ ${#targets[@]} -gt 0 ]]
          pushes=()
          for target in "${targets[@]}"; do
            case "$target" in
              agentteams-controller|embedded|qwenpaw-worker|hermes-worker|openhuman-worker|deepseek-harness-worker|worker) pushes+=("push-$target") ;;
              *) echo "Unknown RC target: $target" >&2; exit 1 ;;
            esac
          done
          make "${pushes[@]}" VERSION="$VERSION" OPENCLAW_BASE_VERSION=v1.2.8 \
            REGISTRY=${{ env.REGISTRY }} REPO=${{ env.REPO }} \
            HIGRESS_REGISTRY=higress-registry.us-west-1.cr.aliyuncs.com \
            DOCKER_BUILD_ARGS="--build-arg APT_MIRROR= --build-arg PIP_INDEX_URL=https://pypi.org/simple/"
          printf 'Built Core-context RC targets: %s\nCodex and Claude Code are published through publish-harnesses.\n' "$requested" >> "$GITHUB_STEP_SUMMARY"
