name: Finish native 1.2.8 staging with separated transport
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
  SOURCE: a5ddf6ae0f6d14797bf14924de12452ab69c3f2a
jobs:
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime: [openhuman, codex]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        if: matrix.runtime == 'codex'
        with:
          repository: agentteams-group/agentteams-harness-codex
          ref: 426bfdd7b0d2eade599afcc166baf1771367d937
          path: codex-harness
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 44551299004
          name: image-controller
          path: /tmp/controller
      - uses: docker/setup-buildx-action@v3
      - name: Native build and smoke, without registry push
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          gzip -dc /tmp/controller/*.tar.gz | docker load
          image="agentteams/agentteams-harness-$RUNTIME:release128-native"
          common="--build-arg APT_MIRROR= --build-arg PIP_INDEX_URL=https://pypi.org/simple/ --label org.opencontainers.image.revision=$SOURCE --label org.opencontainers.image.version=v1.2.8"
          if [[ "$RUNTIME" == openhuman ]]; then
            make -o build-agentteams-controller build-openhuman-worker LOCAL_OPENHUMAN_WORKER="$image" \
              LOCAL_CONTROLLER_BUILD_IMAGE=agentteams/agentteams-controller:latest DOCKER_PLATFORM=linux/amd64 \
              HIGRESS_REGISTRY=higress-registry.us-west-1.cr.aliyuncs.com DOCKER_BUILD_ARGS="$common"
            docker run --rm --entrypoint openhuman-core "$image" --help
          else
            docker build --platform linux/amd64 --build-context at=. $common -t "$image-source" codex-harness
            docker build --platform linux/amd64 $common --build-arg "CODEX_IMAGE=$image-source" \
              --build-arg CONTROLLER_IMAGE=agentteams/agentteams-controller:latest -f scripts/release/Dockerfile.codex -t "$image" .
            docker run --rm --entrypoint codex "$image" --version
            docker run --rm --entrypoint /opt/venv/bin/python "$image" -c 'import agentteams_codex.bridge'
          fi
          docker run --rm --entrypoint agt "$image" tracing --help
          docker save "$image" | gzip > /tmp/native-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image-missing-${{ matrix.runtime }}
          path: /tmp/native-image.tar.gz
          retention-days: 2
  transport:
    needs: native-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [openhuman, codex]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-missing-${{ matrix.runtime }}
          path: /tmp/native
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push previously smoke-tested native AMD64 artifact
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          gzip -dc /tmp/native/*.tar.gz | docker load
          input="agentteams/agentteams-harness-$RUNTIME:release128-native"
          test "$(docker image inspect "$input" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          image="$REGISTRY/agentteams/agentteams-harness-$RUNTIME:transport-v1.2.8-a5ddf6ae-amd64"
          docker tag "$input" "$image"
          timeout 600 docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          echo "$RUNTIME ${image%:*}@$digest" >> "$GITHUB_STEP_SUMMARY"
  verify:
    needs: transport
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [openhuman, codex]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Native AMD64 immutable pull and CLI check
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          image="$REGISTRY/agentteams/agentteams-harness-$RUNTIME:transport-v1.2.8-a5ddf6ae-amd64"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          ref="${image%:*}@$digest"
          timeout 600 docker pull --platform linux/amd64 "$ref"
          docker run --rm --entrypoint agt "$ref" tracing --help
          echo "$RUNTIME $ref native AMD64 passed" >> "$GITHUB_STEP_SUMMARY"
  arm-package:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [qwenpaw, hermes, deepseek, openhuman, codex, embedded]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Refresh CLI in matching ARM64 runtime foundation and verify
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          image="$REGISTRY/agentteams/agentteams-controller:stage-v1.2.8-7e6f68fdafb1-arm64"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          export CONTROLLER="${image%:*}@$digest"
          scripts/release/128-native-stage.sh package "$RUNTIME" arm64
  arm-openclaw:
    needs: native-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Use patched native ARM64 base and latest CLI
        run: |
          image="$REGISTRY/agentteams/agentteams-controller:stage-v1.2.8-7e6f68fdafb1-arm64"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          export CONTROLLER="${image%:*}@$digest"
          image="$REGISTRY/agentteams/openclaw-base:stage-v1.2.8-7e6f68fdafb1-arm64"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          export BASE="${image%:*}@$digest"
          scripts/release/128-native-stage.sh package openclaw arm64
