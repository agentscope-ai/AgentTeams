# Release any yaml-manifest plugin. Tag convention: <metadata.name>-v<semver>;
# the tag prefix always follows metadata.name, so a manifest rename (if one
# ever happens) shifts the prefix without editing this file. Tag parsing and the
# tag/manifest version integrity check both live in
# plugins/scripts/resolve-plugin-release.sh (pre-release accepted, build
# metadata rejected, exact string equality).

name: build-plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin directory, e.g. plugins/teamharness"
        required: true
  push:
    tags: ['*-v[0-9]*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !startsWith(github.ref_name, 'qwen-code-bridge-v') && !(github.event_name == 'workflow_dispatch' && inputs.plugin == 'plugins/qwen-code-bridge') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: none

      - name: Resolve plugin release
        id: resolve
        env:
          PLUGIN_INPUT: ${{ inputs.plugin }}
          TAG_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = "true" ]; then
            bash plugins/scripts/resolve-plugin-release.sh --tag "$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            bash plugins/scripts/resolve-plugin-release.sh --plugin "$PLUGIN_INPUT" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install manifest validation dependencies
        run: python -m pip install 'PyYAML>=6.0,<7' 'jsonschema>=4,<5'

      - name: Validate plugin manifest
        run: ruby plugins/scripts/validate-plugin.rb "${{ steps.resolve.outputs.manifest }}"

      - name: Package plugin
        env:
          OUT_DIR: dist
        run: ruby plugins/scripts/package-plugin.rb "${{ steps.resolve.outputs.manifest }}"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve.outputs.name }}-${{ steps.resolve.outputs.version }}
          path: dist/*

  bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ startsWith(github.ref_name, 'qwen-code-bridge-v') || (github.event_name == 'workflow_dispatch' && inputs.plugin == 'plugins/qwen-code-bridge') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install manifest validation dependencies
        run: python -m pip install 'PyYAML>=6.0,<7' 'jsonschema>=4,<5'

      - name: Validate plugin manifest
        run: ruby plugins/scripts/validate-plugin.rb plugins/qwen-code-bridge/plugin.yaml

      - name: Validate release tag against the bridge manifests
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash plugins/scripts/check-release-tag.sh \
            --tag "$TAG_NAME" \
            --yaml plugins/qwen-code-bridge/plugin.yaml \
            --json plugins/qwen-code-bridge/plugin.json \
            --expect-name qwen-code-bridge

      - name: Skip tag validation on manual dispatch
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "manual dispatch: no release tag to validate"

      - name: Package bridge plugin
        run: sh plugins/qwen-code-bridge/scripts/package.sh dist

      - name: Upload bridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qwen-code-bridge
          path: |
            dist/qwen-code-bridge-*.zip
            dist/sha256sums.txt
            dist/release-manifest.json
